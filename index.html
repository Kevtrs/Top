}
@keyframes banner-in { from { opacity:0; transform: translateY(-10px) scale(0.95); } to { opacity:1; transform: translateY(0) scale(1); } }
.reco-banner-poster { width: 40px; aspect-ratio: 2/3; object-fit: cover; border-radius: 8px; }
.reco-banner-body { flex: 1; min-width: 0; }
.reco-banner-text { flex: 1; font-size: 12px; font-weight: 600; color: rgba(45,42,61,0.8); }
.reco-banner-title { font-weight: 800; font-size: 14px; color: var(--ink); margin-top: 2px; }
.reco-banner-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
.reco-banner-action {
  border: none; border-radius: 999px; padding: 7px 10px;
  min-height: 40px;
  background: rgba(255,255,255,0.62); color: var(--ink);
  font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; font-weight: 800;
  box-shadow: 2px 2px 6px rgba(122,90,31,0.14), -2px -2px 6px rgba(255,255,255,0.34);
}
.reco-banner-action.soft {
  background: rgba(255,255,255,0.34); color: rgba(45,42,61,0.7);
}
.reco-inbox-more {
  width: 100%; min-height: 58px; border: none; border-radius: 16px; padding: 10px 12px;
  display: flex; align-items: center; gap: 10px; text-align: left; color: var(--ink); background: rgba(255,255,255,.62);
  box-shadow: inset 3px 3px 7px var(--shadow-d), inset -3px -3px 7px var(--shadow-l);
  font-family: 'Plus Jakarta Sans', sans-serif;
}
.reco-inbox-more:active { transform: scale(.98); }
.reco-inbox-more-icon {
  width: 34px; height: 34px; flex: 0 0 34px; border-radius: 11px; display: grid; place-items: center;
  color: var(--lav-deep); background: var(--bg);
}
.reco-inbox-more-icon .tab-svg { width: 18px; height: 18px; }
.reco-inbox-more span { min-width: 0; }
.reco-inbox-more strong { display: block; font-size: 11px; font-weight: 800; }
.reco-inbox-more small { display: block; margin-top: 2px; color: var(--ink-soft); font-size: 9px; font-weight: 700; }

/* ═══════════════ RECOMMEND BUTTONS ═══════════════ */
.poster-pick-recommend {
  font-size: 9px; font-weight: 700; color: var(--lav-deep); text-align: center;
  padding: 5px 0 7px; cursor: pointer;
}
.rank-recommend-btn {
  width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--bg);
  box-shadow: 3px 3px 6px var(--shadow-d), -3px -3px 6px var(--shadow-l);
  color: var(--lav-deep); display: grid; place-items: center; cursor: pointer; transition: transform 0.12s;
}
.rank-recommend-btn .tab-svg { width: 18px; height: 18px; }
.rank-recommend-btn:active { transform: scale(0.88); }

.header {
  position: sticky; top: 0; z-index: 100;
  padding: env(safe-area-inset-top, 20px) 20px 14px;
  background: rgba(246,244,252,0.88);
  backdrop-filter: blur(16px) saturate(1.4);
}
.header-row { display:flex; align-items:center; justify-content:space-between; width: 100%; max-width: 1180px; margin: 0 auto; padding-top: 8px; }
.brand-title { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 26px; letter-spacing: 0; }
.brand-logo {
  width: 38px; height: 38px; border-radius: 12px; object-fit: cover; flex-shrink: 0;
  background: rgba(255,255,255,0.78);
  border: 1px solid rgba(154,147,184,0.18);
  box-shadow: 0 6px 16px rgba(154,147,184,0.22), 3px 3px 8px var(--shadow-d), -3px -3px 8px var(--shadow-l);
}
.brand-sub { font-size: 11px; color: var(--ink-soft); font-weight: 600; margin-top: -2px; }
.header-btns { display: flex; gap: 8px; }
.icon-pill {
  width: 44px; height: 44px; border-radius: 50%; background: var(--bg); border: none;
  box-shadow: 4px 4px 8px var(--shadow-d), -4px -4px 8px var(--shadow-l);
  display: flex; align-items: center; justify-content: center; font-size: 15px;
  transition: all 0.15s cubic-bezier(.2,.8,.2,1); cursor: pointer;
  color: var(--lav-deep);
}
.icon-pill .tab-svg { width: 20px; height: 20px; }
.icon-pill:active {
  box-shadow: inset 3px 3px 6px var(--shadow-d), inset -3px -3px 6px var(--shadow-l);
  transform: scale(0.94);
}

.tab-content { width: 100%; max-width: 1180px; margin: 0 auto; padding-bottom: 24px; animation: tab-content-in 0.22s ease; }
@keyframes tab-content-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.app-tabbar-wrap {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 350;
  padding: 0 12px calc(env(safe-area-inset-bottom, 0px) + 8px);
  pointer-events: none;
}
.app-tabbar {
  margin: 0 auto; width: min(620px, 100%); height: 78px; display: flex; align-items: stretch;
  padding: 7px 5px 11px; border-radius: 25px 25px 34px 34px; background: rgba(255,255,255,0.94);
  box-shadow: 8px 8px 22px var(--shadow-d), -8px -8px 22px var(--shadow-l);
  backdrop-filter: blur(18px) saturate(1.25); position: relative; pointer-events: auto;
  user-select: none;
}
.app-tabbar::after {
  content: ""; position: absolute; left: 50%; bottom: 5px; width: 30%; max-width: 150px; height: 4px;
  transform: translateX(-50%); border-radius: 999px; background: rgba(199,194,221,0.25);
}
.app-tab-item {
  all: unset; flex: .78 1 0; min-width: 0; height: 56px; display: flex;
  align-items: center; justify-content: center; gap: 0; color: #BCC2C9; position: relative;
  border-radius: 16px; cursor: pointer; transition: flex-grow .34s cubic-bezier(.2,.8,.2,1), color .28s ease, transform .28s cubic-bezier(.2,.8,.2,1);
}
.app-tab-item::before {
  content: ""; position: absolute; left: 50%; top: 8px; width: 38px; height: 38px; border-radius: 14px;
  background: #FDECEF; background: color-mix(in srgb, var(--tab-color) 28%, white); opacity: 0;
  transform: translateX(-50%) scale(.7); transform-origin: center; transition: transform .36s cubic-bezier(.34,1.56,.64,1), opacity .22s;
}
.app-tab-item::after {
  content: ""; position: absolute; left: 50%; bottom: 0; width: 18px; height: 3px;
  border-radius: 999px; background: currentColor; transform: translateX(-50%) scaleX(0);
  transition: transform .32s cubic-bezier(.2,.8,.2,1);
}
.app-tab-item.active {
  flex-grow: 1.72; gap: 3px; color: var(--lav-deep); color: color-mix(in srgb, var(--tab-color) 68%, var(--lav-deep));
}
.app-tab-item.active::before { width: calc(100% - 8px); max-width: 112px; opacity: 1; transform: translateX(-50%) scale(1); }
.app-tab-item.active::after { transform: translateX(-50%) scaleX(1); }
.app-tab-icon {
  width: 38px; height: 38px; flex: 0 0 38px; display: grid; place-items: center;
  position: relative; z-index: 1; transition: transform .32s cubic-bezier(.2,.8,.2,1);
}
.app-tab-item.active .app-tab-icon { transform: none; }
.app-tab-item.active .app-tab-icon { width: 34px; flex-basis: 34px; }
.app-tab-text {
  position: relative; z-index: 1; display: none; min-width: 0; width: auto; padding-right: 2px; color: currentColor;
  font-size: 10.5px; font-weight: 800; letter-spacing: 0; white-space: nowrap; line-height: 1.1;
}
.app-tab-text.active { display: block; animation: tab-label-in .26s ease both; }
@keyframes tab-label-in { from { opacity: 0; transform: translateX(-4px); } to { opacity: 1; transform: none; } }
@media (max-width: 350px) {
  .app-tab-item.active { flex-grow: 2.35; }
  .app-tab-icon { width: 34px; flex-basis: 34px; }
}
.tab-svg { width: 24px; height: 24px; display: block; }
.app-tab-item.active[data-tab="search"] .tab-search-circle { animation: tab-search-pulse 0.7s ease; }
.app-tab-item.active[data-tab="search"] .tab-search-line { animation: tab-search-line 0.7s ease; transform-origin: 17px 17px; }
.app-tab-item.active[data-tab="top"] .tab-svg { animation: tab-crown-pop 0.7s cubic-bezier(.34,1.56,.64,1); }
.app-tab-item.active[data-tab="watched"] .tab-svg { animation: tab-ticket-snap 0.7s ease; }
.app-tab-item.active[data-tab="watchlist"] .tab-popcorn-kernels { animation: tab-popcorn-pop 0.75s ease; }
.app-tab-item.active[data-tab="badges"] .tab-medal-disc { animation: tab-medal-pop .7s cubic-bezier(.34,1.56,.64,1); transform-origin: 12px 8px; }
.app-tab-item.active[data-tab="badges"] .tab-medal-ribbon { animation: tab-medal-ribbon .7s ease; transform-origin: 12px 13px; }
.app-tab-item.active[data-tab="friends"] .tab-users-side { animation: tab-users-slide 0.65s ease; }
@keyframes tab-search-pulse { 0%,100% { transform: scale(1); } 42% { transform: scale(0.86); } 70% { transform: scale(1.08); } }
@keyframes tab-search-line { 0%,100% { transform: rotate(0deg); } 45% { transform: rotate(-14deg) translate(-1px, 1px); } }
@keyframes tab-crown-pop { 0% { transform: translateY(0) scale(1); } 35% { transform: translateY(-4px) scale(1.08); } 70% { transform: translateY(2px) scale(0.96); } 100% { transform: translateY(0) scale(1); } }
@keyframes tab-ticket-snap { 0%,100% { transform: rotate(0); } 30% { transform: rotate(-8deg) translateY(-1px); } 60% { transform: rotate(5deg); } }
@keyframes tab-hand-wave { 0%,100% { transform: rotate(0deg); } 25% { transform: rotate(15deg); } 55% { transform: rotate(-9deg); } 78% { transform: rotate(7deg); } }
@keyframes tab-popcorn-pop { 0%,100% { transform: translateY(0); } 35% { transform: translateY(-3px); } 62% { transform: translateY(1px); } }
@keyframes tab-medal-pop { 0% { transform: scale(.72) rotate(-12deg); } 55% { transform: scale(1.12) rotate(5deg); } 100% { transform: scale(1) rotate(0); } }
@keyframes tab-medal-ribbon { 0% { transform: translateY(-3px); opacity: .35; } 100% { transform: translateY(0); opacity: 1; } }
@keyframes tab-users-slide { 0% { transform: translateX(3px); opacity: .45; } 100% { transform: translateX(0); opacity: 1; } }

/* Android conserve l'identité Popcorn, avec des proportions proches de
   Material plutôt que de simuler l'interface système d'un iPhone. */
.is-android .app-tabbar-wrap { padding: 0 8px max(env(safe-area-inset-bottom, 0px), 8px); }
.is-android .app-tabbar {
  height: 72px; padding: 5px; border-radius: 22px; background: rgba(255,255,255,.97);
  box-shadow: 0 8px 24px rgba(71,59,96,.18);
}
.is-android .app-tabbar::after { display: none; }
.is-android .app-tab-item { height: 62px; border-radius: 18px; }
.is-android .app-tab-item::before { top: 12px; height: 38px; border-radius: 19px; }
.is-android .app-tab-item::after { bottom: 2px; }
.is-android .icon-pill { border-radius: 14px; }
.is-android .context-sheet {
  border-radius: 28px 28px 0 0;
  padding-bottom: max(env(safe-area-inset-bottom, 0px), 20px);
}
.is-android .context-item, .is-android .movie-action-item { min-height: 56px; }
.is-android .btn-primary, .is-android .btn-secondary { min-height: 48px; }
.is-android body:has(.app-tabbar-wrap) .toast { bottom: calc(env(safe-area-inset-bottom, 0px) + 94px); }

.profile-switcher { display: flex; gap: 8px; margin-top: 14px; }
.profile-switcher-tab { width: calc(100% - 40px); max-width: 980px; margin: 14px auto 6px; overflow-x: auto; padding-bottom: 4px; }
.profile-chip {
  display: flex; align-items: center; gap: 6px;
  background: var(--card); border-radius: 18px; padding: 6px 12px 6px 6px;
  font-size: 12px; font-weight: 700; color: var(--ink-soft);
  box-shadow: 3px 3px 7px var(--shadow-d), -3px -3px 7px var(--shadow-l);
  cursor: pointer; transition: all 0.15s;
}
.profile-chip.active { color: var(--ink); box-shadow: inset 3px 3px 7px var(--shadow-d), inset -3px -3px 7px var(--shadow-l); }
.profile-chip-initial {
  width: 22px; height: 22px; border-radius: 50%; background: var(--pc);

}
.friend-grid {

.friend-card {

  transition: transform 0.14s cubic-bezier(.2,.8,.2,1), box-shadow 0.14s cubic-bezier(.2,.8,.2,1);

.friend-card:active { transform: scale(0.97); }
.friend-card.active {

}
.friend-card span:not(.avatar-initial-sm) { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.friend-card strong { font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.friend-card small { font-size: 11px; color: var(--ink-soft); font-weight: 700; line-height: 1.25; }

.search-wrap { width: calc(100% - 40px); max-width: 980px; margin: 0 auto; padding: 16px 0 4px; }
.search-box {
  background: var(--bg); border-radius: 20px; padding: 14px 18px;
  display: flex; align-items: center; gap: 10px;

  transition: box-shadow 0.2s;
}
.search-box.focused { box-shadow: inset 4px 4px 8px var(--shadow-d), inset -4px -4px 8px var(--shadow-l), 0 0 0 3px rgba(201,184,255,0.4); }
.search-box input { border: none; background: transparent; outline: none; flex: 1; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 500; color: var(--ink); }
.search-box input::-webkit-search-cancel-button { display: none; }
.search-box input::placeholder { color: var(--ink-faint); font-weight: 500; }
.search-icon { width: 19px; height: 19px; color: var(--lav-deep); opacity: 0.45; display: grid; place-items: center; flex-shrink: 0; }
.search-icon .tab-svg { width: 19px; height: 19px; }
.search-clear {
  width: 36px; height: 36px; margin: -7px -10px -7px 0; border: none; border-radius: 50%;

.search-clear[hidden] { display: none; }
.search-clear .tab-svg { width: 17px; height: 17px; }
.search-clear:active { transform: scale(.9); }

.cinema-challenge-section { width: calc(100% - 40px); max-width: 980px; margin: 24px auto 4px; }
.cinema-challenge-heading {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; margin-bottom: 10px;
}
.cinema-challenge-heading > div { min-width: 0; }
.cinema-challenge-heading span { display: block; font-size: 16px; font-weight: 800; line-height: 1.1; }
.cinema-challenge-heading small { display: block; color: var(--ink-soft); font-size: 10.5px; font-weight: 700; margin-top: 3px; }
.cinema-challenge-heading button {

.cinema-challenge-featured::after {

.cinema-challenge-art { width: 82px; height: 82px; position: relative; z-index: 1; }

.cinema-badge-art .badge-back { fill: var(--badge-back); }
.cinema-badge-art .badge-light { fill: var(--badge-light); }
.cinema-badge-art .badge-hot { fill: var(--badge-hot); }

}

@media (min-width: 700px) {
  .search-results, .skeleton-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .context-sheet { margin-bottom: 12px; border-radius: 24px; }
  .collection-intro { padding-top: 30px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

.loading-spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--ink-faint); border-top-color: var(--lav); border-radius: 50%; animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.boot-loading {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 16px;
}
.boot-logo {
  width: 88px; height: 88px; border-radius: 23px; object-fit: cover;
  background: rgba(255,255,255,0.76);
  border: 1px solid rgba(154,147,184,0.18);
  box-shadow: 0 10px 28px rgba(154,147,184,0.22), 7px 7px 18px var(--shadow-d), -7px -7px 18px var(--shadow-l);
}
.boot-loading .loading-spin { width: 28px; height: 28px; border-width: 3px; }

</style>
</head>
<body>
<div id="root"></div>

<div class="context-overlay" id="recommend-overlay" aria-hidden="true">
  <div class="context-sheet" role="dialog" aria-modal="true" aria-label="Recommander le film">
    <button class="context-handle" type="button" aria-label="Fermer"></button>
    <div class="context-preview" id="recommend-preview"></div>
    <div id="recommend-targets"></div>
  </div>
</div>

<div class="context-overlay" id="movie-action-overlay" aria-hidden="true">
  <div class="context-sheet" role="dialog" aria-modal="true" aria-label="Actions du film">
    <button class="context-handle" type="button" aria-label="Fermer"></button>
    <div class="context-preview" id="movie-action-preview"></div>
    <div id="movie-action-items"></div>
  </div>
</div>

<div class="context-overlay" id="install-overlay" aria-hidden="true">
  <div class="context-sheet" role="dialog" aria-modal="true" aria-labelledby="install-title">
    <button class="context-handle" type="button" aria-label="Fermer"></button>
    <img class="install-logo" src="./letop-icon-192.png?v=20260706-popcorn-v10" alt="Popcorn">
    <div class="install-title" id="install-title">Installer Popcorn</div>
    <div class="install-text" id="install-text"></div>
    <div class="install-steps" id="install-steps"></div>
    <div id="install-actions-wrap"></div>
    <button class="btn-primary" id="btn-close-install">OK</button>
  </div>
</div>

<div class="context-overlay" id="settings-overlay" aria-hidden="true">
  <div class="context-sheet settings-sheet" role="dialog" aria-modal="true" aria-label="Réglages">
    <button class="context-handle" type="button" aria-label="Fermer"></button>
    <div class="install-title">Réglages</div>
    <div id="settings-content"></div>
    <button class="btn-secondary" id="btn-close-settings">Fermer</button>
  </div>
</div>

<div class="context-overlay" id="cinema-challenges-overlay" aria-hidden="true">
  <div class="context-sheet cinema-challenges-sheet" role="dialog" aria-modal="true" aria-label="Défis cinéma">
    <button class="context-handle" type="button" aria-label="Fermer"></button>
    <div class="cinema-challenges-sheet-heading">
      <div>
        <div class="install-title">Défis cinéma</div>
        <p>Touche un badge pour afficher directement les films associés.</p>
      </div>
    </div>
    <div id="cinema-challenge-gallery"></div>
    <button class="btn-secondary" id="btn-close-challenges" type="button">Fermer</button>
  </div>
</div>

<div class="context-overlay" id="badge-movies-overlay" aria-hidden="true">
  <div class="context-sheet badge-movies-sheet" role="dialog" aria-modal="true" aria-label="Films associés au badge">
    <button class="context-handle" type="button" aria-label="Fermer"></button>
    <div id="badge-movies-header"></div>
    <div class="badge-movies-section-title">Films associés</div>
    <div id="badge-movies-list"></div>
    <button class="btn-secondary" id="btn-close-badge-movies" type="button">Fermer</button>
  </div>
</div>

<div class="context-overlay badge-unlock-overlay" id="badge-unlock-overlay" aria-hidden="true">
  <div class="context-sheet badge-unlock-sheet" role="dialog" aria-modal="true" aria-labelledby="badge-unlock-title">
    <button class="context-handle" type="button" aria-label="Fermer"></button>
    <div id="badge-unlock-content"></div>
    <div class="badge-unlock-actions">
      <button class="btn-primary" id="btn-view-unlocked-badge" type="button">Voir les films</button>
      <button class="btn-secondary" id="btn-close-badge-unlock" type="button">Continuer</button>
    </div>
  </div>
</div>

<div class="context-overlay confirm-overlay" id="confirm-overlay" aria-hidden="true">
  <div class="context-sheet confirm-sheet" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message">
    <button class="context-handle" type="button" aria-label="Fermer"></button>
    <div id="confirm-icon"></div>
    <h2 id="confirm-title"></h2>
    <p id="confirm-message"></p>
    <div class="confirm-actions">
      <button class="btn-secondary" id="btn-cancel-confirm" type="button">Annuler</button>
      <button class="btn-primary" id="btn-confirm-action" type="button">Confirmer</button>
    </div>
  </div>
</div>

<div class="context-overlay" id="rating-overlay" aria-hidden="true">
  <div class="context-sheet" role="dialog" aria-modal="true" aria-label="Noter le film">
    <button class="context-handle" type="button" aria-label="Fermer"></button>
    <div class="context-preview" id="rating-preview"></div>
    <div class="rating-options" id="rating-options"></div>
    <button class="btn-secondary" id="btn-cancel-rating">Annuler</button>
  </div>
</div>

<div class="context-overlay" id="tonight-pick-overlay" aria-hidden="true">
  <div class="context-sheet tonight-pick-sheet" role="dialog" aria-modal="true" aria-label="Un film pour ce soir">
    <button class="context-handle" type="button" aria-label="Fermer"></button>
    <div id="tonight-pick-content"></div>
    <div class="tonight-pick-actions">
      <button class="btn-primary" id="btn-tonight-pick-watch" type="button"><span>On regarde ça !</span></button>
      <button class="btn-secondary" id="btn-tonight-pick-reroll" type="button"><span>Un autre film</span></button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
</body>
</html>
