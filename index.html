  --ink-soft: #9A93B8;
  --ink-faint: #C7C2DD;

  --shadow-d: rgba(180,170,220,0.35);
  --shadow-l: rgba(255,255,255,0.9);

  --pink: #FF9EB5;   --pink-deep: #7a1f3a;
  --mint: #A8E6CF;   --mint-deep: #1f5a3a;
  --sky: #A8D8FF;    --sky-deep: #1f3a5a;
  --gold: #FFD9A0;   --gold-deep: #7a5a1f;
  --lav: #C9B8FF;    --lav-deep: #4a2f7a;

  --confetti-1: #FF9EB5;
  --confetti-2: #FFD9A0;
  --confetti-3: #A8E6CF;
  --confetti-4: #A8D8FF;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Plus Jakarta Sans', sans-serif;
  min-height: 100vh;
  overscroll-behavior-y: contain;
  padding-bottom: 120px;
}
html.no-page-scroll,
body.no-page-scroll {
  overflow: hidden;
  overscroll-behavior: none;
}
body.no-page-scroll {
  height: 100dvh;
}
body.no-page-scroll #root {
  min-height: 100dvh;
}

.profile-screen {
  min-height: 100vh; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 40px 24px;
}
.profile-logo-img {
  width: 112px; height: 112px; border-radius: 28px; object-fit: cover; margin-bottom: 14px;
  background: rgba(255,255,255,0.72);
  border: 1px solid rgba(154,147,184,0.18);
  box-shadow: 0 12px 34px rgba(154,147,184,0.24), 8px 8px 22px var(--shadow-d), -8px -8px 22px rgba(255,255,255,0.96);
}
.profile-logo { font-weight: 800; font-size: 34px; margin-bottom: 4px; }
.profile-sub { font-size: 13px; color: var(--ink-soft); font-weight: 600; margin-bottom: 36px; }
.profile-cards { display: flex; gap: 14px; width: 100%; max-width: 420px; }
.profile-card {
  flex: 0 0 100px; background: var(--card); border-radius: 24px; padding: 22px 10px; text-align: center;
  box-shadow: 6px 6px 16px var(--shadow-d), -6px -6px 16px var(--shadow-l);
  cursor: pointer; transition: transform 0.15s cubic-bezier(.34,1.56,.64,1);
}
.profile-card:active { transform: scale(0.93); }
.profile-initial {
  width: 52px; height: 52px; border-radius: 50%; margin: 0 auto 10px;
  background: var(--pc); display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 22px; color: white;
}
.profile-avatar-poster {
  width: 52px; height: 52px; border-radius: 50%; margin: 0 auto 10px;
  overflow: hidden; box-shadow: 0 0 0 3px var(--pc);
}
.profile-avatar-poster img { width: 100%; height: 100%; object-fit: cover; }
.profile-name { font-weight: 700; font-size: 13px; }

.profile-cards { flex-wrap: wrap; justify-content: center; }
.profile-card-add { border: 2px dashed var(--ink-faint); box-shadow: none; background: transparent; }
.profile-add-icon { background: var(--bg); color: var(--ink-soft); box-shadow: inset 3px 3px 6px var(--shadow-d), inset -3px -3px 6px var(--shadow-l); font-size: 26px; }
.profile-install-btn {
  margin-top: 22px; border: none; background: var(--bg); color: var(--ink-soft);
  border-radius: 18px; padding: 12px 16px; font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 13px; font-weight: 800; box-shadow: inset 3px 3px 7px var(--shadow-d), inset -3px -3px 7px var(--shadow-l);
}
.profile-install-btn:active { transform: scale(0.97); }

.btn-secondary {
  width: 100%; background: transparent; color: var(--ink-soft); border: none;
  padding: 12px; font-weight: 700; font-size: 14px; cursor: pointer;
  font-family: 'Plus Jakarta Sans', sans-serif;
}

/* ═══════════════ ONBOARDING ═══════════════ */
.onboard-screen { min-height: 100vh; padding: 60px 24px 24px; }
.onboard-screen .profile-logo-img { display: block; margin: 0 auto 20px; }
.onboard-step { font-size: 11px; font-weight: 700; color: var(--lav-deep); letter-spacing: 1.5px; margin-bottom: 8px; }
.onboard-title { font-weight: 800; font-size: 26px; margin-bottom: 10px; }
.onboard-text { font-size: 14px; color: var(--ink-soft); font-weight: 500; line-height: 1.6; }
.onboard-text strong { color: var(--ink); }
.gate-screen {
  min-height: 100vh; padding: 58px 24px calc(env(safe-area-inset-bottom, 24px) + 24px);
  display: flex; flex-direction: column; justify-content: center;
}
.gate-screen .profile-logo-img { display: block; margin: 0 auto 22px; }
.gate-steps {
  display: flex; flex-direction: column; gap: 10px; margin: 20px 0 18px;
}
.gate-step {
  background: rgba(255,255,255,0.78); border-radius: 18px; padding: 14px;
  font-size: 13px; font-weight: 800; color: var(--ink);
  box-shadow: 5px 5px 14px var(--shadow-d), -5px -5px 14px var(--shadow-l);
}
.gate-step span {
  display: inline-flex; width: 26px; height: 26px; align-items: center; justify-content: center;
  margin-right: 9px; border-radius: 50%; background: var(--lav); color: white; font-size: 12px;
}

/* ═══════════════ AVATAR HELPERS ═══════════════ */
.avatar-poster { border-radius: 50%; object-fit: cover; display: inline-block; vertical-align: middle; }
.avatar-initial-sm {
  border-radius: 50%; color: white; font-weight: 800; font-size: 10px;
  display: inline-flex; align-items: center; justify-content: center; vertical-align: middle;
}

/* ═══════════════ NOTIFICATION BANNER ═══════════════ */
.reco-banner-zone { padding: 14px 20px 0; display: flex; flex-direction: column; gap: 10px; }
.reco-banner {
  background: linear-gradient(120deg, var(--gold), var(--pink));
  border-radius: 18px; padding: 12px 14px; display: flex; align-items: center; gap: 12px;
  box-shadow: 5px 5px 14px var(--shadow-d), -5px -5px 14px var(--shadow-l);
  cursor: pointer; animation: banner-in 0.35s cubic-bezier(.34,1.56,.64,1);
}
@keyframes banner-in { from { opacity:0; transform: translateY(-10px) scale(0.95); } to { opacity:1; transform: translateY(0) scale(1); } }
.reco-banner-poster { width: 40px; aspect-ratio: 2/3; object-fit: cover; border-radius: 8px; }
.reco-banner-body { flex: 1; min-width: 0; }
.reco-banner-text { flex: 1; font-size: 12px; font-weight: 600; color: rgba(45,42,61,0.8); }
.reco-banner-title { font-weight: 800; font-size: 14px; color: var(--ink); margin-top: 2px; }
.reco-banner-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
.reco-banner-action {
  border: none; border-radius: 999px; padding: 7px 10px;
  background: rgba(255,255,255,0.62); color: var(--ink);
  font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; font-weight: 800;
  box-shadow: 2px 2px 6px rgba(122,90,31,0.14), -2px -2px 6px rgba(255,255,255,0.34);
}
.reco-banner-action.soft {
  background: rgba(255,255,255,0.34); color: rgba(45,42,61,0.7);
}

/* ═══════════════ RECOMMEND BUTTONS ═══════════════ */
.poster-pick-recommend {
  font-size: 9px; font-weight: 700; color: var(--lav-deep); text-align: center;
  padding: 5px 0 7px; cursor: pointer;
}
.rank-recommend-btn {
  width: 34px; height: 34px; border-radius: 50%; border: none; background: var(--bg);
  box-shadow: 3px 3px 6px var(--shadow-d), -3px -3px 6px var(--shadow-l);
  font-size: 14px; cursor: pointer; transition: transform 0.12s;
}
.rank-recommend-btn:active { transform: scale(0.88); }

.header {
  position: sticky; top: 0; z-index: 100;
  padding: env(safe-area-inset-top, 20px) 20px 14px;
  background: rgba(246,244,252,0.88);
  backdrop-filter: blur(16px) saturate(1.4);
}
.header-row { display:flex; align-items:center; justify-content:space-between; padding-top: 8px; }
.brand-title { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 26px; letter-spacing: -0.5px; }
.brand-logo {
  width: 38px; height: 38px; border-radius: 12px; object-fit: cover; flex-shrink: 0;
  background: rgba(255,255,255,0.78);
  border: 1px solid rgba(154,147,184,0.18);
  box-shadow: 0 6px 16px rgba(154,147,184,0.22), 3px 3px 8px var(--shadow-d), -3px -3px 8px var(--shadow-l);
}
.brand-sub { font-size: 11px; color: var(--ink-soft); font-weight: 600; margin-top: -2px; }
.header-btns { display: flex; gap: 8px; }
.icon-pill {
  width: 38px; height: 38px; border-radius: 50%; background: var(--bg); border: none;
  box-shadow: 4px 4px 8px var(--shadow-d), -4px -4px 8px var(--shadow-l);
  display: flex; align-items: center; justify-content: center; font-size: 15px;
  transition: all 0.15s cubic-bezier(.2,.8,.2,1); cursor: pointer;
  color: var(--lav-deep); position: relative;
}
.icon-pill .tab-svg { width: 20px; height: 20px; }
.icon-pill:active {
  box-shadow: inset 3px 3px 6px var(--shadow-d), inset -3px -3px 6px var(--shadow-l);
  transform: scale(0.94);
}

.tab-content { padding-bottom: 24px; animation: tab-content-in 0.22s ease; }
@keyframes tab-content-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.app-tabbar-wrap {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 350;
  padding: 0 10px calc(env(safe-area-inset-bottom, 0px) + 8px);
  pointer-events: none;
}
.app-tabbar {
  margin: 0 auto; width: min(54em, 100%); height: 8.6em; display: flex; align-items: center;
  padding: 0 1.7em 2.2em; border-radius: 2.2em 2.2em 4.2em 4.2em; background: rgba(255,255,255,0.94);
  box-shadow: 8px 8px 22px var(--shadow-d), -8px -8px 22px var(--shadow-l);
  backdrop-filter: blur(18px) saturate(1.25); position: relative; pointer-events: auto;
  font-size: clamp(8px, 2.25vw, 10px); user-select: none;
}
.app-tabbar::after {
  content: ""; position: absolute; left: 50%; bottom: 1.05em; width: 35%; height: .48em;
  transform: translateX(-50%); border-radius: 999px; background: rgba(199,194,221,0.25);
}
.app-tab-item {
  all: unset; flex-grow: 1; min-width: 0; height: 5.4em; display: flex; align-items: center; justify-content: center;
  color: #CDD2D7; position: relative; overflow: hidden; border-radius: 18px; cursor: pointer;
  transition: flex-grow 0.45s cubic-bezier(0.4,0,0.2,1), color 0.35s cubic-bezier(0.4,0,0.2,1);
}
.app-tab-item::before {
  content: ""; position: absolute; left: 2.15em; top: 50%; width: 1.75em; height: 1.75em; border-radius: 50%;
  background: #FDECEF; background: color-mix(in srgb, var(--tab-color) 28%, white); opacity: 0;
  transform: translateY(-50%) scale(0); transform-origin: center; transition: transform 0.45s cubic-bezier(.34,1.56,.64,1), opacity 0.25s;
}
.app-tab-item::after {
  content: ""; position: absolute; left: 4.85em; bottom: .2em; width: calc(var(--lineWidth, 3em) + .5em); height: .25em;
  border-radius: 2em; background: currentColor; transform: scaleX(0); transform-origin: left center;
  transition: transform 0.45s cubic-bezier(0.4,0,0.2,1);
}
.app-tab-item.active { flex: 0 0 16.2em; min-width: 16.2em; color: var(--lav-deep); color: color-mix(in srgb, var(--tab-color) 70%, var(--lav-deep)); }
.app-tab-item.active::before { opacity: 1; transform: translateY(-50%) scale(1); }
.app-tab-item.active::after { transform: scaleX(1); }
.app-tab-icon {
  font-size: 1.05em; width: 3.1em; height: 3.1em; display: grid; place-items: center;
  position: relative; z-index: 1; transition: transform 0.45s cubic-bezier(0.4,0,0.2,1);
}
.app-tab-item.active .app-tab-icon {
  position: absolute; left: 1.45em; top: 50%;
  transform: translateY(-50%);
}
.tab-badge-dot {
  position: absolute; top: 0.1em; right: 0.1em; width: 0.7em; height: 0.7em;
  border-radius: 50%; background: var(--pink); box-shadow: 0 0 0 0.2em var(--card);
}
.app-tab-text {
  position: absolute; left: 4.85em; top: 50%; max-width: calc(100% - 5.2em);
  font-size: 1.22em; font-weight: 800; letter-spacing: 0;
  transform: translate3d(0,120%,0); opacity: 0; transition: transform 0.16s ease, opacity 0.12s ease;
  white-space: nowrap; line-height: 1; overflow: hidden;
}
.app-tab-text.active { transform: translate3d(0,-50%,0); opacity: 1; transition: transform 0.3s ease 0.1s, opacity 0.2s ease 0.1s; }
.tab-svg { width: 2.55em; height: 2.55em; display: block; }
.app-tab-item.active[data-tab="search"] .tab-search-circle { animation: tab-search-pulse 0.7s ease; }
.app-tab-item.active[data-tab="search"] .tab-search-line { animation: tab-search-line 0.7s ease; transform-origin: 17px 17px; }
.app-tab-item.active[data-tab="top"] .tab-svg { animation: tab-crown-pop 0.7s cubic-bezier(.34,1.56,.64,1); }
.app-tab-item.active[data-tab="watched"] .tab-svg { animation: tab-ticket-snap 0.7s ease; }
.app-tab-item.active[data-tab="watchlist"] .tab-popcorn-kernels { animation: tab-popcorn-pop 0.75s ease; }
.app-tab-item.active[data-tab="friends"] .tab-users-side { animation: tab-users-slide 0.65s ease; }
.app-tab-item.active[data-tab="badges"] .tab-svg { animation: tab-crown-pop 0.7s cubic-bezier(.34,1.56,.64,1); }
@keyframes tab-search-pulse { 0%,100% { transform: scale(1); } 42% { transform: scale(0.86); } 70% { transform: scale(1.08); } }
@keyframes tab-search-line { 0%,100% { transform: rotate(0deg); } 45% { transform: rotate(-14deg) translate(-1px, 1px); } }
@keyframes tab-crown-pop { 0% { transform: translateY(0) scale(1); } 35% { transform: translateY(-4px) scale(1.08); } 70% { transform: translateY(2px) scale(0.96); } 100% { transform: translateY(0) scale(1); } }
@keyframes tab-ticket-snap { 0%,100% { transform: rotate(0); } 30% { transform: rotate(-8deg) translateY(-1px); } 60% { transform: rotate(5deg); } }
@keyframes tab-hand-wave { 0%,100% { transform: rotate(0deg); } 25% { transform: rotate(15deg); } 55% { transform: rotate(-9deg); } 78% { transform: rotate(7deg); } }
@keyframes tab-popcorn-pop { 0%,100% { transform: translateY(0); } 35% { transform: translateY(-3px); } 62% { transform: translateY(1px); } }
@keyframes tab-users-slide { 0% { transform: translateX(3px); opacity: .45; } 100% { transform: translateX(0); opacity: 1; } }

.profile-switcher { display: flex; gap: 8px; margin-top: 14px; }
.profile-switcher-tab { margin: 14px 20px 6px; overflow-x: auto; padding-bottom: 4px; }
.profile-chip {
  display: flex; align-items: center; gap: 6px;
  background: var(--card); border-radius: 18px; padding: 6px 12px 6px 6px;
  font-size: 12px; font-weight: 700; color: var(--ink-soft);
  box-shadow: 3px 3px 7px var(--shadow-d), -3px -3px 7px var(--shadow-l);
  cursor: pointer; transition: all 0.15s;
}
.profile-chip.active { color: var(--ink); box-shadow: inset 3px 3px 7px var(--shadow-d), inset -3px -3px 7px var(--shadow-l); }
.profile-chip-initial {
  width: 22px; height: 22px; border-radius: 50%; background: var(--pc);
  color: white; display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 800;
}
.friend-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px; padding: 0 20px 2px;
}
.friend-card {
  border: none; background: var(--card); border-radius: 20px; min-height: 76px; padding: 12px;
  display: flex; align-items: center; gap: 11px; text-align: left; color: var(--ink);
  font-family: 'Plus Jakarta Sans', sans-serif; box-shadow: 5px 5px 14px var(--shadow-d), -5px -5px 14px var(--shadow-l);
  transition: transform 0.14s cubic-bezier(.2,.8,.2,1), box-shadow 0.14s cubic-bezier(.2,.8,.2,1);
}
.friend-card:active { transform: scale(0.97); }
.friend-card.active {
  box-shadow: inset 4px 4px 10px var(--shadow-d), inset -4px -4px 10px var(--shadow-l);
}
.friend-card span:not(.avatar-initial-sm) { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.friend-card strong { font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.friend-card small { font-size: 11px; color: var(--ink-soft); font-weight: 700; line-height: 1.25; }
.friend-level-chip { font-size: 10px; font-weight: 800; color: var(--gold-deep); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.search-wrap { padding: 16px 0 4px; }
.search-box {
  background: var(--bg); border-radius: 20px; padding: 14px 18px;
  display: flex; align-items: center; gap: 10px;
  box-shadow: inset 4px 4px 8px var(--shadow-d), inset -4px -4px 8px var(--shadow-l);
  transition: box-shadow 0.2s;
}
.search-box.focused { box-shadow: inset 4px 4px 8px var(--shadow-d), inset -4px -4px 8px var(--shadow-l), 0 0 0 3px rgba(201,184,255,0.4); }
.search-box input { border: none; background: transparent; outline: none; flex: 1; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 500; color: var(--ink); }
.search-box input::placeholder { color: var(--ink-faint); font-weight: 500; }
.search-icon { width: 19px; height: 19px; color: var(--lav-deep); opacity: 0.45; display: grid; place-items: center; flex-shrink: 0; }
.search-icon .tab-svg { width: 19px; height: 19px; }

.quick-home-grid {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px; padding: 12px 20px 2px;
}
.quick-home-card {
  border: none; background: var(--card); border-radius: 18px; padding: 14px;
  display: grid; grid-template-columns: 38px 1fr; column-gap: 10px; row-gap: 2px;
  align-items: center; text-align: left; font-family: 'Plus Jakarta Sans', sans-serif;
  box-shadow: 5px 5px 14px var(--shadow-d), -5px -5px 14px var(--shadow-l);
  color: var(--ink); cursor: pointer; transition: transform 0.12s cubic-bezier(.34,1.56,.64,1), box-shadow 0.12s;
}
.quick-home-card:active {
  transform: scale(0.96);
  box-shadow: inset 4px 4px 9px var(--shadow-d), inset -4px -4px 9px var(--shadow-l);
}
.quick-home-icon {
  grid-row: 1 / span 2; width: 38px; height: 38px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center; color: var(--lav-deep);
  background: var(--bg); box-shadow: inset 3px 3px 7px var(--shadow-d), inset -3px -3px 7px var(--shadow-l);
}
.quick-home-icon .tab-svg { width: 22px; height: 22px; }
.quick-home-card strong { font-size: 14px; font-weight: 800; line-height: 1.1; }
.quick-home-card small { color: var(--ink-soft); font-size: 10px; font-weight: 700; line-height: 1.15; }

.search-results { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 16px 20px; }
.poster-pick {
  position: relative; border-radius: 16px; overflow: hidden; cursor: pointer; background: var(--card);
  box-shadow: 5px 5px 12px var(--shadow-d), -5px -5px 12px var(--shadow-l);
  transition: transform 0.15s cubic-bezier(.34,1.56,.64,1);
  animation: pop-in 0.3s cubic-bezier(.34,1.56,.64,1) backwards;
}
.poster-pick:nth-child(1) { animation-delay: 0.02s; } .poster-pick:nth-child(2) { animation-delay: 0.06s; }
.poster-pick:nth-child(3) { animation-delay: 0.10s; } .poster-pick:nth-child(4) { animation-delay: 0.14s; }
.poster-pick:nth-child(5) { animation-delay: 0.18s; } .poster-pick:nth-child(6) { animation-delay: 0.22s; }
@keyframes pop-in { from { opacity:0; transform: scale(0.85) translateY(8px); } to { opacity:1; transform: scale(1) translateY(0); } }
.poster-pick:active { transform: scale(0.93); }
.poster-pick img { width:100%; aspect-ratio:2/3; object-fit:cover; display:block; }
.poster-pick-title { font-size: 11px; font-weight: 600; padding: 8px 9px 9px; line-height: 1.25; color: var(--ink); }
.poster-pick.added { opacity: 0.3; pointer-events: none; }

.skeleton-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; padding: 16px 20px; }
.skeleton-card {
  border-radius: 16px; aspect-ratio: 2/3.4; background: #E8E4F5;
  background-image: linear-gradient(90deg, rgba(255,255,255,0) 0, rgba(255,255,255,0.7) 50%, rgba(255,255,255,0) 100%);
  background-size: 80px 100%; background-repeat: no-repeat; background-position: -80px 0;
  animation: shine 1.1s ease infinite;
}
@keyframes shine { to { background-position: calc(100% + 80px) 0; } }

.section-label { font-size: 12px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.5px; padding: 22px 20px 10px; }

.rank-list { padding: 0 20px; display: flex; flex-direction: column; gap: 12px; }
.rank-card {
  display: grid; grid-template-columns: 56px 64px 1fr auto; align-items: center; gap: 14px;
  background: var(--card); border-radius: 20px; padding: 10px 14px 10px 4px;
  box-shadow: 5px 5px 14px var(--shadow-d), -5px -5px 14px var(--shadow-l);
  position: relative; transition: transform 0.18s cubic-bezier(.2,.8,.2,1), box-shadow 0.18s;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: pan-y;
}
.rank-card.dragging { opacity: 0.4; animation: wobble 0.5s ease infinite; }
@keyframes wobble { 0% { transform: rotate(0deg); } 20% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } 80% { transform: rotate(-1deg); } 100% { transform: rotate(0deg); } }
.rank-card.pressed { box-shadow: inset 4px 4px 10px var(--shadow-d), inset -4px -4px 10px var(--shadow-l); transform: scale(0.98); }
.rank-touch-dragging .rank-list { touch-action: none; }
