async function saveRankingToCloud(userId, rankedArray) {
  if (!userId) return;
  if (userId === currentUser) await ensureProfileInCloud(userId);
  const profile = profilePayload(userId);
  allRankings = { ...allRankings, [userId]: rankedArray };
  updateCollectionSummaries();
  await setDoc(doc(db, "rankings", userId), { movies: rankedArray, updatedAt: Date.now(), ...profileMetaPayload(profile) }, { merge: true });
}

function listenAllRankings(cb) {
  return onSnapshot(collection(db, "rankings"), snap => {
    const data = {};
    const profiles = [];
    snap.forEach(d => {
      const raw = d.data();
      data[d.id] = raw.movies || [];
      profiles.push(profileFromDataDoc(raw, d.id));
    });
    updateProfileDocSource("rankings", profiles);
    cb(data);
  }, () => {
    updateProfileDocSource("rankings", []);
    cb({});
  });
}

function slugify(name) {
  return name.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // enlève les accents
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
}
function profileNameFromId(profileId) {
  return String(profileId || "Profil")
    .split("-")
    .filter(Boolean)
    .map(part => part[0]?.toUpperCase() + part.slice(1))
    .join(" ") || "Profil";
}
function profilePayload(userId, preferredName = "") {
  const existing = profileById(userId) || {};
  const storedName = userId === currentUser ? (localStorage.getItem(USER_NAME_KEY) || "") : "";
  const name = (preferredName || existing.name || storedName || profileNameFromId(userId)).trim();
  return {
    id: userId,
    name,
    initial: existing.initial || name[0]?.toUpperCase() || "?",
    color: existing.color || PROFILE_COLORS[Math.max(PROFILES.length + PROFILE_INDEX.length, 0) % PROFILE_COLORS.length],
    createdAt: existing.createdAt || Date.now(),
    updatedAt: Date.now()
  };
}
function profileMetaPayload(profile) {
  return {
    profile,
    profileId: profile.id,
    profileName: profile.name,
    profileUpdatedAt: Date.now()
  };
}
function profileFromDataDoc(raw, fallbackId) {
  return normalizeProfileData(raw?.profile || {
    id: raw?.profileId,
    name: raw?.profileName,
    initial: raw?.profileInitial,
    color: raw?.profileColor,
    createdAt: raw?.profileCreatedAt
  }, fallbackId);
}
function updateProfileDocSource(source, profiles) {
  PROFILE_DOC_SOURCES[source] = profiles.map(p => normalizeProfileData(p, p.id)).filter(p => p.id);
  const map = new Map();
  Object.values(PROFILE_DOC_SOURCES).flat().forEach(profile => {
    const normalized = normalizeProfileData(profile, profile.id);
    if (!normalized.id) return;
    map.set(normalized.id, { ...(map.get(normalized.id) || {}), ...normalized });
  });
  DATA_PROFILES = [...map.values()];
}
function forgetLocalProfile(userId) {
  PROFILES = PROFILES.filter(p => p.id !== userId);
  PROFILE_INDEX = PROFILE_INDEX.filter(p => p.id !== userId);
  DATA_PROFILES = DATA_PROFILES.filter(p => p.id !== userId);
  Object.keys(PROFILE_DOC_SOURCES).forEach(source => {
    PROFILE_DOC_SOURCES[source] = PROFILE_DOC_SOURCES[source].filter(p => p.id !== userId);
  });
  publishedProfileIds.delete(userId);
}
async function createProfile(id, name) {
  const payload = profilePayload(id, name);
  const meta = profileMetaPayload(payload);
  const writes = await Promise.allSettled([
    setDoc(doc(db, "profiles", id), payload, { merge: true }),
    setDoc(doc(db, "profileIndex", id), payload, { merge: true }),
    setDoc(doc(db, "rankings", id), meta, { merge: true }),
    setDoc(doc(db, "watched", id), meta, { merge: true }),
    setDoc(doc(db, "watchlist", id), meta, { merge: true })
  ]);
  if (!writes.some(result => result.status === "fulfilled")) throw new Error("profile-write-failed");
  PROFILES = [...PROFILES.filter(p => p.id !== id), payload];
  PROFILE_INDEX = [...PROFILE_INDEX.filter(p => p.id !== id), payload];

function ensureRecoPrefsListener() {

  if (recoPrefsUser === currentUser && recoPrefsUnsub) return;
  if (recoPrefsUnsub) {
    try { recoPrefsUnsub(); } catch (e) {}
  }
  recoPrefsUser = currentUser;
  recoPrefs = loadLocalRecoPrefs(currentUser);
  recoPrefsUnsub = onSnapshot(doc(db, "recoPrefs", currentUser), snap => {
    if (recoPrefsUser !== currentUser) return;

  }, () => {});

    // renderPage() — s'il voit encore creatingProfile=true, il réaffiche
    // l'écran de saisie du nom et écrase ce flux en cours.
    creatingProfile = false;
    currentUser = id;
    viewingUser = id;
    localStorage.setItem("letop_user", id);

    if (existingProfile) {
      localStorage.setItem(USER_NAME_KEY, existingProfile.name);
      const hasMovies = (allRankings[id] || []).length > 0;
      onboardingNewUser = hasMovies ? null : id;
      await syncPendingPushTokenForCurrentUser();
      showToast(`Bon retour ${existingProfile.name}`);
      if (hasMovies) {
        renderPage();
      } else {
        renderOnboarding();
      }
      return;
    }

    onboardingNewUser = id;
    localStorage.setItem(USER_NAME_KEY, name);
    try {
      await createProfile(id, name);
      await syncPendingPushTokenForCurrentUser();
      renderOnboarding();
    } catch (e) {
      creatingProfile = true;
      onboardingNewUser = null;
      currentUser = null;
      viewingUser = null;
      localStorage.removeItem("letop_user");
      localStorage.removeItem(USER_NAME_KEY);
      showToast("Erreur de création du profil");
      renderCreateProfileScreen();
    }
  };

  document.getElementById("btn-confirm-name").addEventListener("click", confirm);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") confirm(); });
  document.getElementById("btn-cancel-create")?.addEventListener("click", () => {
    creatingProfile = false;
    renderPage();
  });
  document.getElementById("btn-install-profile").addEventListener("click", openInstallSheet);
}

// ─── ONBOARDING — choisir son film n°1 (devient l'avatar) ─────────
function renderOnboarding() {
  const onboardingId = onboardingNewUser;
  const me = profileById(onboardingId) || { id: onboardingId, name: "toi" };
  document.getElementById("root").innerHTML = `
  <div class="onboard-screen">
    <div class="onboard-step">ÉTAPE 1/1</div>
    <div class="onboard-title">Salut ${escapeHtml(me.name)}</div>
    <div class="onboard-text">Cherche ton film préféré — il deviendra ton numéro 1 <strong>et</strong> ta photo de profil.</div>
    <div class="search-box" id="onboard-search-box" style="margin-top:18px">
      <span class="search-icon">${tabIconHtml("search")}</span>
      <input type="text" id="onboard-search-input" placeholder="Ton film n°1...">
    </div>
    <div id="onboard-results"></div>
  </div>`;

  const input = document.getElementById("onboard-search-input");
  const box = document.getElementById("onboard-search-box");
  input.addEventListener("focus", () => box.classList.add("focused"));
  input.addEventListener("blur", () => box.classList.remove("focused"));
  let t;
  let selectingMovie = false;
  input.addEventListener("input", (e) => {
    clearTimeout(t);
    const q = e.target.value;
    const zone = document.getElementById("onboard-results");
    if (!q.trim()) { zone.innerHTML = ""; return; }
    zone.innerHTML = `<div class="skeleton-grid">${Array(6).fill('<div class="skeleton-card"></div>').join("")}</div>`;
    t = setTimeout(async () => {
      try {
        const results = await searchMovies(q);
        if (!document.body.contains(zone) || input.value !== q || onboardingNewUser !== onboardingId) return;
        if (!results.length) { zone.innerHTML = `<div style="padding:16px;text-align:center;color:var(--ink-faint);font-size:13px;font-weight:600">Aucun résultat</div>`; return; }
        zone.innerHTML = `<div class="search-results">${results.slice(0,9).map(m => {
          const poster = m.poster_path ? TMDB_IMG + m.poster_path : "";
          const title = escapeHtml(m.title);
          const year = m.release_date ? ` (${escapeHtml(m.release_date.slice(0,4))})` : "";
          return `
          <div class="poster-pick" data-movie='${escapeAttr(JSON.stringify(simplifyMovie(m)))}'>
            ${poster ? `<img src="${poster}" alt="${escapeAttr(m.title)}">` : `<div style="aspect-ratio:2/3;background:#E8E4F5"></div>`}
            <div class="poster-pick-title">${title}${year}</div>
          </div>`;
        }).join("")}</div>`;
        zone.querySelectorAll(".poster-pick").forEach(card => {
          card.addEventListener("click", async () => {
            if (selectingMovie) return;
            selectingMovie = true;
            card.style.pointerEvents = "none";
            const movie = JSON.parse(card.dataset.movie);
            const userId = onboardingNewUser;
            onboardingNewUser = null;
            try {
              await ensureProfileInCloud(userId, me.name);
              await saveRankingToCloud(userId, [movie]);
              showToast(`Bienvenue ${me.name}`);
            } catch (e) {
              onboardingNewUser = userId;
              showToast("Erreur d'enregistrement");
              renderOnboarding();
              return;
            }
            onboardingNewUser = null;
            renderPage();
          });
        });
      } catch(e) {
        if (!document.body.contains(zone) || input.value !== q || onboardingNewUser !== onboardingId) return;
        zone.innerHTML = `<div style="padding:16px;text-align:center;color:var(--ink-faint);font-size:13px;font-weight:600">Erreur de recherche</div>`;
      }
    }, 350);
  });
}

function watchedAverage() {
  const ratings = myWatched().map(movie => Number(movie.rating)).filter(Number.isFinite);
  if (!ratings.length) return null;
  return ratings.reduce((sum, rating) => sum + rating, 0) / ratings.length;
}

function renderApp() {
  const me = profileById(currentUser) || (currentUser ? fallbackProfile(currentUser) : null);
  if (!me) {
    normalizeActiveUsers();
    renderProfilePicker();
    return;
  }
  if (currentUser) ensureProfileInCloud(currentUser, me.name);
  let viewed = profileById(viewingUser) || (!profilesServerConfirmed && viewingUser ? fallbackProfile(viewingUser) : null);
  if (!viewed && activeTab === "friends") {
    viewed = friendProfiles().find(p => p.id === viewingUser) || null;
  }
  if (!viewed) {
    viewingUser = currentUser;
    viewed = me;
  }
  if (activeTab !== "friends") {
    viewingUser = currentUser;
    viewed = me;
  } else if (viewingUser === currentUser) {
    const firstFriend = friendProfiles()[0];
    if (firstFriend) {
      viewingUser = firstFriend.id;
      viewed = firstFriend;
    }
  }
  const myIncoming = incomingRecos.filter(r => r.to === currentUser && !r.seen);
  syncPendingPushTokenForCurrentUser();

  document.getElementById("root").innerHTML = `
    <div class="header">
      <div class="header-row">
        <div>
          <div class="brand-title">${appLogoHtml("brand-logo", "icon")}Popcorn</div>
        </div>
        <div class="header-btns">
          <button class="icon-pill" id="btn-settings" type="button" title="Réglages" aria-label="Ouvrir les réglages">${tabIconHtml("settings")}</button>
        </div>
      </div>
    </div>

    <main class="tab-content">
      ${renderActiveTabContent(viewed, myIncoming)}
    </main>

    ${renderTabBar()}
  `;

  attachAppEvents();
  renderActiveTabView();
  setTimeout(announceNewChallengeUnlocks, 80);

}

function renderPage() {
  applyPlatformMode();
  ensureRecoPrefsListener();
  if (currentUser) syncPendingPushTokenForCurrentUser();
  if (shouldForceInstallGate()) {
    renderInstallGate();
    return;
  }
  if (shouldForceNotificationGate()) {
    renderNotificationGate();
    return;
  }
  if (!profilesSynced && !creatingProfile && !onboardingNewUser) {
    renderBootLoading();
    return;
  }
  if (!rankingsSynced && !onboardingNewUser) {
    renderBootLoading();
    return;
  }
  if (currentUser && !rankingsSynced && !onboardingNewUser) {
    renderBootLoading();
    return;
  }
  if (onboardingNewUser) {
    renderOnboarding();
  } else if (!currentUser || creatingProfile) {
    renderProfilePicker();
  } else {
    renderApp();
  }
}

function renderPagePreservingScroll() {
  const savedScrollY = window.scrollY;
  renderPage();
  if (savedScrollY) requestAnimationFrame(() => window.scrollTo(0, savedScrollY));
}

function renderActiveTabView() {
  if (activeTab === "search") {
    ensureChallengeMetadata();
    if (recoExpanded) updateRecommendations();
    if (recentExpanded) renderRecentFeed();
  } else if (activeTab === "watched") {
    renderWatchedList();
  } else if (activeTab === "watchlist") {
    renderWatchlist();
  } else if (activeTab === "badges") {
    ensureChallengeMetadata();
    renderChallengesGallery(document.getElementById("badges-challenge-gallery"));
  } else if (activeTab === "top" || activeTab === "friends") {
    renderRanked();
  }
}

function attachSearchControls(input, box, zone, runSearchHandler) {
  if (!box || !input || !zone) return;
  const clearButton = document.getElementById(`${input.id}-clear`);
  let searchTimeout;
  const syncClearButton = () => {
    if (clearButton) clearButton.hidden = !input.value;
  };
  const clearSearch = () => {
    clearTimeout(searchTimeout);
    input.value = "";
    zone.innerHTML = "";
    syncClearButton();
    input.focus({ preventScroll: true });
  };
  input.addEventListener("focus", () => box.classList.add("focused"));
  input.addEventListener("blur", () => box.classList.remove("focused"));
  input.addEventListener("input", () => {
    clearTimeout(searchTimeout);
    syncClearButton();
    const query = input.value;
    if (!query.trim()) { zone.innerHTML = ""; return; }
    zone.innerHTML = `<div class="skeleton-grid" aria-label="Recherche en cours">${Array(6).fill('<div class="skeleton-card"></div>').join("")}</div>`;
    searchTimeout = setTimeout(() => runSearchHandler(query), 350);
  });
  clearButton?.addEventListener("click", clearSearch);
  syncClearButton();
}

function attachShelfSearch(mode) {
  const box = document.getElementById(`${mode}-search-box`);
  const input = document.getElementById(`${mode}-search-input`);
  const zone = document.getElementById(`${mode}-results-zone`);
  attachSearchControls(input, box, zone, query => runShelfSearch(query, mode));
}

function attachGlobalSearch() {
  const box = document.getElementById("global-search-box");
  const input = document.getElementById("global-search-input");
  const zone = document.getElementById("global-results-zone");
  attachSearchControls(input, box, zone, runGlobalSearch);
}

function attachAppEvents() {
  document.getElementById("btn-settings")?.addEventListener("click", openSettingsSheet);

  document.querySelectorAll(".app-tab-item").forEach(btn => {
    btn.addEventListener("click", () => {
      const nextTab = btn.dataset.tab;
      if (nextTab === activeTab) {
        window.scrollTo({ top: 0, behavior: "smooth" });
        tabScrollPositions[activeTab] = 0;
        return;
      }
      tabScrollPositions[activeTab] = window.scrollY;
      platformTapFeedback();
      activeTab = nextTab;
      if (activeTab !== "friends") viewingUser = currentUser;
      renderPage();
      requestAnimationFrame(() => window.scrollTo({ top: tabScrollPositions[activeTab] || 0, behavior: "auto" }));
    });
  });
  document.querySelectorAll(".empty-state-action").forEach(btn => {
    btn.addEventListener("click", () => {
      tabScrollPositions[activeTab] = window.scrollY;
      activeTab = btn.dataset.goTab;
      tabScrollPositions[activeTab] = 0;
      if (activeTab !== "friends") viewingUser = currentUser;
      renderPage();
      requestAnimationFrame(() => window.scrollTo({ top: 0, behavior: "auto" }));
    });
  });
  const toggleIncomingRecos = () => {
    incomingRecosExpanded = !incomingRecosExpanded;
    renderPagePreservingScroll();
  };
  document.getElementById("btn-toggle-incoming-recos")?.addEventListener("click", toggleIncomingRecos);
  document.getElementById("btn-show-incoming-recos")?.addEventListener("click", toggleIncomingRecos);
  attachBadgesTabEvents();
  document.getElementById("btn-tonight-pick")?.addEventListener("click", openTonightPickSheet);

  document.getElementById("btn-reset")?.addEventListener("click", () => {
    openConfirmSheet({
      title: "Vider ton Top ?",
      message: "Tes films vus et ta liste À voir resteront intacts.",
      confirmLabel: "Vider le Top",

  header?.setAttribute("aria-expanded", String(expand));

function showToast(msg, action = null) {
  const t = document.getElementById("toast");
  if (!t) return;
  clearTimeout(toastTimer);
  t.innerHTML = `<span>${escapeHtml(msg)}</span>${action ? `<button type="button">${escapeHtml(action.label || "Annuler")}</button>` : ""}`;
  t.classList.toggle("has-action", !!action);
  t.classList.add("show");
  t.querySelector("button")?.addEventListener("click", () => {
    clearTimeout(toastTimer);
    t.classList.remove("show");
    action?.onClick?.();
  }, { once: true });
  toastTimer = setTimeout(() => t.classList.remove("show"), action ? 5200 : 2400);
}

function fireConfetti(originEl) {
  const rect = originEl.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const colors = ['var(--confetti-1)','var(--confetti-2)','var(--confetti-3)','var(--confetti-4)'];
  for (let i = 0; i < 22; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.background = colors[i % colors.length];
    piece.style.left = cx + 'px';
    piece.style.top = cy + 'px';
    const angle = (Math.PI * 2 * i) / 22 + (Math.random()*0.5);
    const dist = 60 + Math.random() * 70;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist - 30;
    const rot = Math.random() * 720 - 360;
    document.body.appendChild(piece);
    piece.animate([
      { transform: 'translate(0,0) rotate(0deg) scale(1)', opacity: 1 },
      { transform: `translate(${dx}px, ${dy}px) rotate(${rot}deg) scale(0.4)`, opacity: 0 }
    ], { duration: 700 + Math.random()*300, easing: 'cubic-bezier(.2,.8,.2,1)' }).onfinish = () => piece.remove();
  }
}

async function addToWatched(movie, rating) {
  if (!currentUser || !movie) return;
  const progressSnapshot = activeChallengeProgressSnapshot();
  const list = myWatched();
  const watchedMovie = { ...simplifyMovie(movie), watchedAt: Date.now(), rating };
  const existingIndex = list.findIndex(m => m.id === movie.id);
  const updated = existingIndex >= 0 ? [...list] : [watchedMovie, ...list];
  if (existingIndex >= 0) updated[existingIndex] = { ...updated[existingIndex], ...watchedMovie };
  allWatched = { ...allWatched, [currentUser]: updated };
  if (activeTab === "badges") refreshBadgesTabIfActive();
  else renderWatchedList();
  showToast(`${movie.title} noté ${rating}/10`);
  try {
    await saveWatchedToCloud(currentUser, updated);
  } catch (e) {
    showToast("Film noté, synchronisation à réessayer");
    return;
  }
  if (!(watchedMovie.genre_ids || []).length) {
    try {
      const details = await getMovieDetails(watchedMovie.id);
      const director = (details.credits?.crew || []).find(person => person.job === "Director");
      const enriched = {
        ...watchedMovie,
        genre_ids: (details.genres || []).map(genre => Number(genre.id)),
        keyword_ids: (details.keywords?.keywords || details.keywords?.results || []).map(keyword => Number(keyword.id)).slice(0, 8),
        original_language: details.original_language || null,
        director_id: director?.id || null,
        director_name: director?.name || null,
        collection_id: details.belongs_to_collection?.id || null,
        collection_name: details.belongs_to_collection?.name || null,
        challenge_meta_at: Date.now(),
        challenge_meta_failed_at: 0
      };
      const enrichedList = updated.map(item => Number(item.id) === Number(enriched.id) ? enriched : item);
      await saveWatchedToCloud(currentUser, enrichedList);
      if (activeTab === "badges") refreshBadgesTabIfActive();
    } catch (e) {
      // ensureChallengeMetadata will retry without losing the rating.
    }
  }
  announceChallengeProgress(progressSnapshot);
}

function handleMovieAction(action) {
  const movie = pendingActionMovie;
  if (!movie) return;
  if (action === "top") {
    const fromRecommendation = pendingActionOrigin === "recommendation";
    addToRanked(movie);
    if (fromRecommendation) removeRecommendedCardForMovie(movie.id);
    closeMovieActionSheet();
  } else if (action === "watched") {
    const origin = ["watchlist", "recommendation"].includes(pendingActionOrigin) ? pendingActionOrigin : null;
    closeMovieActionSheet();
    openRatingSheet(movie, origin);
  } else if (action === "watchlist") {
    const fromRecommendation = pendingActionOrigin === "recommendation";
    addToWatchlist(movie);
    if (fromRecommendation) removeRecommendedCardForMovie(movie.id);
    closeMovieActionSheet();
  } else if (action === "recommend") {
    closeMovieActionSheet();
    openRecommendSheet(movie);
  } else if (action === "remove-top") {
    removeFromTop(movie.id);
    closeMovieActionSheet();
  } else if (action === "remove-watched") {
    removeFromWatched(movie.id);
    closeMovieActionSheet();
  } else if (action === "remove-watchlist") {
    removeFromWatchlist(movie.id);
    closeMovieActionSheet();
  }
}

function attachRankInteractions() {
  const rows = document.querySelectorAll(".rank-card");

  rows.forEach(row => {
    row.addEventListener("dragstart", () => {
      draggedIndex = parseInt(row.dataset.index);
      suppressNextRankClick = true;
      row.classList.add("dragging");
    });
    row.addEventListener("dragend", () => {
      row.classList.remove("dragging");
      rows.forEach(r => r.classList.remove("drop-line-top","drop-line-bottom"));
      setTimeout(() => { suppressNextRankClick = false; }, 120);
    });
    row.addEventListener("dragover", (e) => {
      e.preventDefault();
      const targetIndex = parseInt(row.dataset.index);
      if (draggedIndex === null || targetIndex === draggedIndex) return;
      const rect = row.getBoundingClientRect();
      const mid = rect.top + rect.height/2;
      row.classList.remove("drop-line-top","drop-line-bottom");
      row.classList.add(e.clientY < mid ? "drop-line-top" : "drop-line-bottom");
    });
    row.addEventListener("dragleave", () => row.classList.remove("drop-line-top","drop-line-bottom"));
    row.addEventListener("drop", (e) => {
      e.preventDefault();
      const targetIndex = parseInt(row.dataset.index);
      const insertAfter = row.classList.contains("drop-line-bottom");
      row.classList.remove("drop-line-top","drop-line-bottom");
      if (draggedIndex === null || targetIndex === draggedIndex) return;
      moveMovie(draggedIndex, targetIndex, insertAfter);
      draggedIndex = null;
    });

    let pressTimer = null;
    let startX = 0;
    let startY = 0;
    let lastTouch = null;

    const clearPressTimer = () => {
      clearTimeout(pressTimer);
      pressTimer = null;
      row.classList.remove("pressed");
    };

    row.addEventListener("touchstart", (e) => {
      if (e.touches.length !== 1 || touchDragState) return;
      const touch = e.touches[0];
      startX = touch.clientX;
      startY = touch.clientY;
      lastTouch = { clientX: touch.clientX, clientY: touch.clientY };
      row.classList.add("pressed");
      pressTimer = setTimeout(() => {
        startTouchRankDrag(row, lastTouch);
        pressTimer = null;
      }, 320);
    }, { passive: true });

    row.addEventListener("touchmove", (e) => {
      const touch = e.touches[0];
      if (!touch) return;
      lastTouch = { clientX: touch.clientX, clientY: touch.clientY };

      if (touchDragState) {
        e.preventDefault();
        updateTouchRankDrag(lastTouch);
        return;
      }

      const dx = Math.abs(touch.clientX - startX);
      const dy = Math.abs(touch.clientY - startY);
      if (pressTimer && (dx > 8 || dy > 8)) clearPressTimer();
    }, { passive: false });

    row.addEventListener("touchend", (e) => {
      if (touchDragState) {
        e.preventDefault();
        finishTouchRankDrag();
      }
      clearPressTimer();
    });

    row.addEventListener("touchcancel", () => {
      cancelTouchRankDrag();
      clearPressTimer();
    });

    row.addEventListener("click", (e) => {
      if (suppressNextRankClick || touchDragState) return;
      if (e.target.closest(".rank-drag-handle")) return;
      const index = parseInt(row.dataset.index);
      const movie = myRanked()[index];
      if (movie) openMovieActionSheet(movie, "top", index);
    });
  });
}

function clearTouchDropMarkers() {
  document.querySelectorAll(".rank-card").forEach(r => r.classList.remove("drop-line-top","drop-line-bottom"));
}

function startTouchRankDrag(row, touch) {
  if (!touch || touchDragState) return;
  const rect = row.getBoundingClientRect();
  const ghost = row.cloneNode(true);
  ghost.classList.add("touch-drag-ghost");
  ghost.style.left = rect.left + "px";
  ghost.style.top = rect.top + "px";
  ghost.style.width = rect.width + "px";
  ghost.style.height = rect.height + "px";
  ghost.style.pointerEvents = "none";
  ghost.removeAttribute("id");

  document.body.appendChild(ghost);
  document.body.classList.add("rank-touch-dragging");
  row.classList.remove("pressed");
  row.classList.add("touch-drag-source");

  touchDragState = {
    sourceIndex: parseInt(row.dataset.index),
    targetIndex: null,
    insertAfter: false,
    sourceRow: row,
    ghost,
    offsetY: touch.clientY - rect.top,
    latestY: touch.clientY,
    autoScrollSpeed: 0,
    autoScrollFrame: null
  };

  if (navigator.vibrate) navigator.vibrate(8);
  updateTouchRankDrag(touch);
}

function updateTouchRankDrag(touch) {
  if (!touchDragState) return;
  touchDragState.latestY = touch.clientY;
  touchDragState.ghost.style.top = (touch.clientY - touchDragState.offsetY) + "px";
  updateTouchDropTarget(touch.clientY);
  updateTouchAutoScroll(touch.clientY);
}

function updateTouchDropTarget(y) {
  if (!touchDragState) return;
  clearTouchDropMarkers();
  const rows = [...document.querySelectorAll(".rank-card:not(.touch-drag-source):not(.touch-drag-ghost)")];
  if (!rows.length) {
    touchDragState.targetIndex = null;
    touchDragState.insertAfter = false;
    return;
  }

  let target = rows.find(row => {
    const rect = row.getBoundingClientRect();
    return y >= rect.top && y <= rect.bottom;
  });

  if (!target) {
    const sourceRect = touchDragState.sourceRow.getBoundingClientRect();
    if (y >= sourceRect.top && y <= sourceRect.bottom) {
      touchDragState.targetIndex = null;
      touchDragState.insertAfter = false;
      return;
    }
    target = rows.reduce((closest, row) => {
      const rect = row.getBoundingClientRect();
      const distance = Math.abs(y - (rect.top + rect.height / 2));
      return !closest || distance < closest.distance ? { row, distance } : closest;
    }, null).row;
  }

  const rect = target.getBoundingClientRect();
  const insertAfter = y > rect.top + rect.height / 2;
  touchDragState.targetIndex = parseInt(target.dataset.index);
  touchDragState.insertAfter = insertAfter;
  target.classList.add(insertAfter ? "drop-line-bottom" : "drop-line-top");
}

function updateTouchAutoScroll(y) {
  if (!touchDragState) return;
  const edge = 78;
  const maxSpeed = 13;
  let speed = 0;
  if (y < edge) {
    speed = -Math.ceil(((edge - y) / edge) * maxSpeed);
  } else if (y > window.innerHeight - edge) {
    speed = Math.ceil(((y - (window.innerHeight - edge)) / edge) * maxSpeed);
  }

  touchDragState.autoScrollSpeed = speed;
  if (speed !== 0 && !touchDragState.autoScrollFrame) {
    touchDragState.autoScrollFrame = requestAnimationFrame(runTouchAutoScroll);
  }
}

function runTouchAutoScroll() {
  if (!touchDragState) return;
  if (touchDragState.autoScrollSpeed !== 0) {
    window.scrollBy(0, touchDragState.autoScrollSpeed);
    updateTouchDropTarget(touchDragState.latestY);
    touchDragState.autoScrollFrame = requestAnimationFrame(runTouchAutoScroll);
  } else {
    touchDragState.autoScrollFrame = null;
  }
}

function finishTouchRankDrag() {
  if (!touchDragState) return;
  const { sourceIndex, targetIndex, insertAfter, sourceRow, ghost, autoScrollFrame } = touchDragState;
  if (autoScrollFrame) cancelAnimationFrame(autoScrollFrame);
  clearTouchDropMarkers();
  sourceRow.classList.remove("touch-drag-source");
  ghost.remove();
  document.body.classList.remove("rank-touch-dragging");
  touchDragState = null;

  if (targetIndex === null || targetIndex === sourceIndex) return;
  suppressNextRankClick = true;
  setTimeout(() => { suppressNextRankClick = false; }, 250);
  moveMovie(sourceIndex, targetIndex, insertAfter);
}

function cancelTouchRankDrag() {
  if (!touchDragState) return;
  const { sourceRow, ghost, autoScrollFrame } = touchDragState;
  if (autoScrollFrame) cancelAnimationFrame(autoScrollFrame);
  clearTouchDropMarkers();
  sourceRow.classList.remove("touch-drag-source");
  ghost.remove();
  document.body.classList.remove("rank-touch-dragging");
  touchDragState = null;
  suppressNextRankClick = true;
  setTimeout(() => { suppressNextRankClick = false; }, 250);
}

function moveMovie(fromIdx, toIdx, insertAfter) {
  const list = [...myRanked()];
  if (fromIdx < 0 || fromIdx >= list.length || toIdx < 0 || toIdx >= list.length) return;
  const [movie] = list.splice(fromIdx, 1);
  let newIndex = toIdx;
  if (fromIdx < toIdx) newIndex--;
  if (insertAfter) newIndex++;
  newIndex = Math.max(0, Math.min(newIndex, list.length));
  list.splice(newIndex, 0, movie);
  saveRankingToCloud(currentUser, list).catch(() => showToast("Erreur d'enregistrement"));
  renderRanked();
  if (newIndex === 0) {
    setTimeout(() => {
      const firstCard = document.querySelector('.rank-card[data-pos="1"] .rank-badge');
      if (firstCard) fireConfetti(firstCard);
    }, 80);
  }
}

function notificationStatusLabel() {
  if (!("Notification" in window)) return "Non disponible";
  if (Notification.permission === "granted") return "Activées";
  if (Notification.permission === "denied") return "Bloquées";
  return "À activer";
}

function notificationIconName() {
  return ("Notification" in window && Notification.permission === "granted") ? "bell" : "bell-off";
}

function openConfirmSheet({ title, message, confirmLabel = "Confirmer", danger = false, onConfirm }) {
  const overlay = document.getElementById("confirm-overlay");
  if (!overlay) return;
  pendingConfirmAction = typeof onConfirm === "function" ? onConfirm : null;
  overlay.classList.toggle("is-danger", danger);
  document.getElementById("confirm-icon").innerHTML = surfaceIconHtml(danger ? "trash" : "check", "confirm-dialog-icon");
  document.getElementById("confirm-title").textContent = title;
  document.getElementById("confirm-message").textContent = message;
  document.getElementById("btn-confirm-action").textContent = confirmLabel;
  overlay.classList.add("show");
  scheduleScrollLockUpdate();
}

function closeConfirmSheet() {
  document.getElementById("confirm-overlay")?.classList.remove("show");
  pendingConfirmAction = null;
  scheduleScrollLockUpdate();
}

async function runConfirmedAction() {
  const action = pendingConfirmAction;
  const button = document.getElementById("btn-confirm-action");
  if (!action || button?.disabled) return;
  if (button) button.disabled = true;
  document.getElementById("confirm-overlay")?.classList.remove("show");
  pendingConfirmAction = null;
  scheduleScrollLockUpdate();
  try {
    await action();
  } catch (e) {
    showToast("Action impossible pour le moment");
  } finally {
    if (button) button.disabled = false;
  }
}

function setupPwaInstallMetadata() {
  const links = [
    { rel: "apple-touch-icon", href: `./apple-touch-icon.png?v=${PWA_VERSION}` },
    { rel: "icon", href: `./favicon.png?v=${PWA_VERSION}`, type: "image/png", sizes: "64x64" },
    { rel: "manifest", href: `./site.webmanifest?v=${PWA_VERSION}` }
  ];
  links.forEach(linkData => {
    let link = document.querySelector(`link[rel="${linkData.rel}"]`);
    if (!link) {
      link = document.createElement("link");
      link.rel = linkData.rel;
      document.head.appendChild(link);
    }
    Object.entries(linkData).forEach(([key, value]) => link.setAttribute(key, value));
  });
}

async function setupForegroundPushListener() {
  if (foregroundPushListening || !isPushConfigured() || !canUsePushHere()) return;
  try {
    if (!(await isMessagingSupported())) return;
    const messaging = getMessaging(app);
    onMessage(messaging, payload => {

      showToast(body);
      if (profilesSynced && rankingsSynced && currentUser && !onboardingNewUser) renderPagePreservingScroll();
    });
    foregroundPushListening = true;

async function getPushRegistrationToken() {
  if (!(await isMessagingSupported())) throw new Error("unsupported");
  const registration = await navigator.serviceWorker.register(`./firebase-messaging-sw.js?v=${PWA_VERSION}`);
  const messaging = getMessaging(app);
  return await getToken(messaging, {
    vapidKey: FCM_VAPID_KEY,
    serviceWorkerRegistration: registration
  });
}
async function savePushTokenForProfile(profileId, token) {
  if (!profileId || !token) return;
  const now = Date.now();
  const currentTokenId = tokenDocId(token);
  await setDoc(doc(db, "pushTokens", profileId, "tokens", currentTokenId), {
    token,
    profileId,
    userAgent: navigator.userAgent,
    platform: navigator.platform || "",
    updatedAt: now,
    createdAt: now
  }, { merge: true });
  try {
    const snap = await getDocs(collection(db, "pushTokens", profileId, "tokens"));
    await Promise.all(snap.docs
      .filter(d => d.id !== currentTokenId && d.data().userAgent === navigator.userAgent)
      .map(d => deleteDoc(d.ref)));
  } catch (e) {}
  localStorage.setItem(PUSH_BOUND_KEY, `${profileId}:${currentTokenId}`);
}
async function syncPendingPushTokenForCurrentUser() {
  if (!currentUser || !isPushConfigured() || !canUsePushHere()) return;
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  let token = localStorage.getItem(PENDING_PUSH_TOKEN_KEY);
  try {
    if (!token) {
      token = await getPushRegistrationToken();
      if (token) localStorage.setItem(PENDING_PUSH_TOKEN_KEY, token);
    }
    if (!token) return;
    const boundKey = `${currentUser}:${tokenDocId(token)}`;
    if (localStorage.getItem(PUSH_BOUND_KEY) === boundKey) return;
    await savePushTokenForProfile(currentUser, token);
  } catch (e) {}
}

async function ensureGenreData() {
  if (!currentUser) return;
  const list = myRanked();
  const missing = list.filter(m => !m.genre_ids || !m.genre_ids.length || m.keyword_ids === undefined);
  if (!missing.length) return;
  await Promise.all(missing.map(async (m) => {
    try {
      const details = await getMovieDetails(m.id);
      m.genre_ids = (details.genres || []).map(g => g.id);
      m.keyword_ids = (details.keywords?.keywords || details.keywords?.results || []).map(k => k.id).slice(0, 8);
      const director = (details.credits?.crew || []).find(c => c.job === "Director");
      m.director_id = director ? director.id : null;
      m.director_name = director ? director.name : null;
      m.original_language = details.original_language || null;
      m.collection_id = details.belongs_to_collection?.id || null;
      m.collection_name = details.belongs_to_collection?.name || null;
      m.challenge_meta_at = Date.now();
    } catch(e) {
      m.genre_ids = m.genre_ids || [];
      m.keyword_ids = m.keyword_ids || [];
    }
  }));
  await saveRankingToCloud(currentUser, list).catch(() => showToast("Erreur d'enregistrement"));
}

async function ensureChallengeMetadata() {
  if (!currentUser || challengeMetadataLoading) return;
  const ranked = myRanked();
  const watched = myWatched();
  const all = [...ranked, ...watched];
  const missingById = new Map();
  const metadataRetryDelay = 2 * 60 * 1000;
  all.forEach(movie => {
    if (!movie?.id) return;
    const hasGenres = Array.isArray(movie.genre_ids) && movie.genre_ids.length > 0;
    const hasMetadata = hasGenres && Number(movie.challenge_meta_at) > 0;
    const failedRecently = Date.now() - Number(movie.challenge_meta_failed_at || 0) < metadataRetryDelay;
    if (hasMetadata || failedRecently) return;
    missingById.set(Number(movie.id), movie);
  });
  const queue = [...missingById.values()].slice(0, 16);
  if (!queue.length) {
    const director = preferredDirectorFromSeen(challengeSeenMovies());
    if (director) ensureDirectorFilmography(director);
    return;
  }

  challengeMetadataLoading = true;
  const metadata = new Map();
  try {
    await Promise.all(queue.map(async movie => {
      try {
        const details = await getMovieDetails(movie.id);
        const director = (details.credits?.crew || []).find(person => person.job === "Director");
        metadata.set(Number(movie.id), {
          genre_ids: (details.genres || []).map(genre => Number(genre.id)),
          keyword_ids: (details.keywords?.keywords || details.keywords?.results || []).map(keyword => Number(keyword.id)).slice(0, 8),
          original_language: details.original_language || null,
          director_id: director?.id || null,
          director_name: director?.name || null,
          collection_id: details.belongs_to_collection?.id || null,
          collection_name: details.belongs_to_collection?.name || null,
          challenge_meta_at: Date.now(),
          challenge_meta_failed_at: 0
        });
      } catch (e) {
        metadata.set(Number(movie.id), { challenge_meta_failed_at: Date.now() });
      }
    }));

    const applyMetadata = list => {
      let changed = false;
      list.forEach(movie => {
        const next = metadata.get(Number(movie.id));
        if (!next) return;
        Object.assign(movie, next);
        changed = true;
      });
      return changed;
    };
    const rankedChanged = applyMetadata(ranked);
    const watchedChanged = applyMetadata(watched);
    await Promise.all([
      rankedChanged ? saveRankingToCloud(currentUser, ranked) : Promise.resolve(),
      watchedChanged ? saveWatchedToCloud(currentUser, watched) : Promise.resolve()
    ]);

    const director = preferredDirectorFromSeen(challengeSeenMovies());
    if (director) await ensureDirectorFilmography(director);
    if (activeTab === "badges" && (rankedChanged || watchedChanged)) refreshBadgesTabIfActive();
  } catch (e) {
    // Badges keep their basic genre progress when metadata enrichment fails.
  } finally {
    challengeMetadataLoading = false;
    if (missingById.size > queue.length) setTimeout(ensureChallengeMetadata, 900);
  }
}

// Drame (18), Comedie (35), Romance (10749) sont trop larges pour suffire seuls.
const GENERIC_GENRE_IDS = new Set([18, 35, 10749]);

function computeGenreWeights(list) {
  const weights = {};
  const focused = list.slice(0, 25);
  const n = Math.max(focused.length, 1);
  focused.forEach((m, i) => {
    const rankRatio = (n - i) / n;
    const podiumBoost = i === 0 ? 5 : i === 1 ? 3.6 : i === 2 ? 2.8 : i < 10 ? 1.7 : 1;
    const positionWeight = podiumBoost * (1 + rankRatio * 3);
    const genres = m.genre_ids || [];
    genres.forEach(gid => {
      const genericDiscount = GENERIC_GENRE_IDS.has(gid) ? 0.35 : 1;
      weights[gid] = (weights[gid] || 0) + (positionWeight / Math.max(genres.length, 1)) * genericDiscount;
    });
  });
  const max = Math.max(...Object.values(weights), 1);
  Object.keys(weights).forEach(gid => { weights[gid] = (weights[gid] / max) * 10; });
  return weights;
}

function computeKeywordWeights(list) {
  const weights = {};
  const focused = list.slice(0, 25);
  const n = Math.max(focused.length, 1);
  focused.forEach((m, i) => {
    const rankRatio = (n - i) / n;
    const podiumBoost = i === 0 ? 5 : i === 1 ? 3.6 : i === 2 ? 2.8 : i < 10 ? 1.7 : 1;
    const positionWeight = podiumBoost * (1 + rankRatio * 3);
    (m.keyword_ids || []).forEach(kid => { weights[kid] = (weights[kid] || 0) + positionWeight; });
  });
  return weights;
}

function computeFavoriteDirectors(list) {
  const scores = {};
  const names = {};
  list.slice(0, 25).forEach((m, i) => {
    if (!m.director_id) return;
    const bonus = i < 3 ? 3 : i < 10 ? 2 : 1;
    scores[m.director_id] = (scores[m.director_id] || 0) + bonus;
    names[m.director_id] = m.director_name;
  });
  return Object.entries(scores)
    .filter(([, score]) => score >= 3)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 4)
    .map(([id]) => ({ id: Number(id), name: names[id] }));
}

function topWeightedIds(weights, limit = 5) {
  return Object.entries(weights)
    .sort((a, b) => b[1] - a[1])
    .slice(0, limit)
    .map(([id]) => Number(id));
}

function topGenreIds(genreWeights, limit = 5) {
  return topWeightedIds(genreWeights, limit);
}

function sourceWeightForRank(index) {
  if (index === 0) return 8;
  if (index === 1) return 6.4;
  if (index === 2) return 5.2;
  return Math.max(2, 4.4 - index * 0.35);
}

function pickRecommendationSources(list, genreWeights) {
  const selected = [];
  const usedPrimaryGenres = new Set();
  list.slice(0, 14).forEach((movie, index) => {
    const genres = (movie.genre_ids || []).filter(gid => genreWeights[gid] > 0);
    if (!genres.length) return;
    const primary = [...genres].sort((a, b) => (genreWeights[b] || 0) - (genreWeights[a] || 0))[0];
    if (index < 3 || !usedPrimaryGenres.has(primary) || selected.length < 5) {
      selected.push({ movie, weight: sourceWeightForRank(index), sourceRank: index + 1 });
      usedPrimaryGenres.add(primary);
    }
  });
  return selected.slice(0, 7);
}

function shouldKeepRecommendationCandidate(candidate, knownIds, ignoredIds, genreWeights, sourceWeight = 0, challengeMatch = false) {
  const candidateId = Number(candidate?.id);
  if (!candidateId || knownIds.has(candidateId) || ignoredIds.has(candidateId)) return false;
  if (!candidate.poster_path) return false;
  const genres = candidate.genre_ids || [];
  const matchedGenres = genres.filter(gid => genreWeights[gid] > 0);
  if (!matchedGenres.length && !challengeMatch) return false;
  const hasSpecificGenreMatch = matchedGenres.some(gid => !GENERIC_GENRE_IDS.has(gid));
  if (!hasSpecificGenreMatch && sourceWeight < 3 && !challengeMatch) return false;
  const voteCount = Number(candidate.vote_count) || 0;
  const voteAverage = Number(candidate.vote_average) || 0;
  return voteCount >= 60 || voteAverage >= 7.3;
}

function scoreCandidate(candidate, genreWeights, prefs = recoPrefs) {
  const genres = candidate.genre_ids || [];
  const challengeBoost = Number(candidate._challengeBoost) || 0;
  if (!genres.length && !challengeBoost) return -999;
  const matchedGenres = genres.filter(gid => genreWeights[gid] > 0);
  if (!matchedGenres.length && !challengeBoost) return -999;
  const hasSpecificGenreMatch = matchedGenres.some(gid => !GENERIC_GENRE_IDS.has(gid));

  const likedWeight = matchedGenres.reduce((sum, gid) => sum + (genreWeights[gid] || 0), 0);
  const coverage = matchedGenres.length / Math.max(genres.length, 1);
  const dislikedPenalty = genres.reduce((sum, gid) => sum + (Number(prefs.dislikedGenreWeights?.[gid]) || 0), 0);
  const voteAverage = Number(candidate.vote_average) || 0;
  const voteCount = Number(candidate.vote_count) || 0;
  const voteConfidence = Math.min(5, Math.log10(voteCount + 10));
  const sourceBoost = Number(candidate._sourceWeight) || 0;
  const crossBoost = Number(candidate._crossBoost) || 0;
  const popularity = Number(candidate.popularity) || 0;
  const mainstreamPenalty = sourceBoost >= 5 ? 0 : Math.max(0, popularity - 80) * 0.045;

  let score = 0;
  score += likedWeight * (1.45 + coverage);
  score += matchedGenres.length * 4.5;
  score += voteAverage * 1.35;
  score += voteConfidence * 2.2;
  score += sourceBoost * 1.6;
  score += crossBoost * 2.3;
  score += challengeBoost;
  score -= dislikedPenalty * 7;
  score -= mainstreamPenalty;
  if (!hasSpecificGenreMatch && sourceBoost < 3 && !challengeBoost) score -= 14;
  if (coverage < 0.34 && !challengeBoost) score -= 9;
  if (voteCount < 80) score -= 4;
  return score;
}

function computeCrossProfileSignals(currentUserId) {
  const boost = new Map();
  const reason = new Map();
  Object.entries(allRankings).forEach(([profileId, list]) => {
    if (profileId === currentUserId || !Array.isArray(list) || !list.length) return;
    const name = profileNameFromId(profileId);
    list.slice(0, 20).forEach((m, idx) => {
      const id = Number(m.id);
      if (!id) return;
      const rankBonus = idx === 0 ? 7.5 : idx === 1 ? 6 : idx === 2 ? 5 : idx < 10 ? 3.2 : 1.6;
      boost.set(id, (boost.get(id) || 0) + rankBonus);
      const existingReason = reason.get(id);
      if (!existingReason || rankBonus > existingReason.rankBonus) {
        reason.set(id, { rankBonus, text: idx < 3 ? `${name} l'a mis dans son Top 3` : `${name} l'a aussi classé` });
      }
    });
  });
  return { boost, reason };
}

function sortRecommendationCandidates(candidates, genreWeights, prefs, threshold) {
  return [...candidates]
    .map(m => ({ ...m, _score: scoreCandidate(m, genreWeights, prefs) }))
    .filter(m => m._score > threshold)
    .sort((a,b) => b._score - a._score);
}

function mergeRecommendationCandidate(map, movie, meta = {}) {
  if (!movie?.id) return;
  const sourceWeight = Number(meta.sourceWeight) || 0;
  const existing = map.get(movie.id);
  if (existing) {
    existing._sourceWeight = Math.max(existing._sourceWeight || 0, sourceWeight);
    if (meta.because && !(existing._because || []).includes(meta.because)) existing._because.push(meta.because);
    if (meta.challengeId && !(existing._challengeIds || []).includes(meta.challengeId)) existing._challengeIds.push(meta.challengeId);
    return;
  }
  map.set(movie.id, {
    ...movie,
    _sourceWeight: sourceWeight,
    _because: meta.because ? [meta.because] : [],
    _challengeIds: meta.challengeId ? [meta.challengeId] : []
  });
}

function recommendationReason(movie) {
  if (movie._challengeName) return `Avance vers ${movie._challengeName}`;
  if (movie._crossReason) return movie._crossReason;
  const reason = movie._because?.[0];
  if (reason) return `Proche de ${reason}`;
  return "Selon tes genres préférés";
}

function removeRecommendedCard(card) {
  if (!card) return;
  const scroll = card.closest(".reco-scroll");
  card.classList.add("is-removing");
  setTimeout(() => {
    card.remove();
    if (scroll && !scroll.querySelector(".reco-item")) {
      scroll.innerHTML = `<div style="padding:20px"><span class="loading-spin"></span></div>`;
      setTimeout(() => {
        if (activeTab === "search" && recoExpanded && document.body.contains(scroll) && !scroll.querySelector(".reco-item")) {
          updateRecommendations();
        }
      }, 120);
    }
    scheduleScrollLockUpdate();
  }, 180);
}

function removeRecommendedCardForMovie(movieId) {
  const card = [...document.querySelectorAll("#reco-scroll .reco-item")]
    .find(el => String(el.dataset.id) === String(movieId));
  if (card) removeRecommendedCard(card);
}

async function persistIgnoredMovie(movie, dislikedGenreWeights, toastText) {
  const userId = currentUser;
  const ignoredIds = new Set(recoPrefs.ignoredIds || []);
  ignoredIds.add(Number(movie.id));
  const nextPrefs = normalizeRecoPrefs({
    ignoredIds: [...ignoredIds],
    dislikedGenreWeights,
    updatedAt: Date.now()
  });
  recoPrefs = nextPrefs;
  saveLocalRecoPrefs(userId, nextPrefs);
  showToast(toastText);
  try {
    await setDoc(doc(db, "recoPrefs", userId), nextPrefs, { merge: true });
  } catch (e) {
    showToast("Refus gardé sur cet appareil");
  }
}

async function ignoreRecommendedMovie(movie, card = null) {
  if (!currentUser || !movie?.id) return;
  const dislikedGenreWeights = { ...(recoPrefs.dislikedGenreWeights || {}) };
  (movie.genre_ids || []).forEach(gid => {
    dislikedGenreWeights[gid] = Math.min(8, (Number(dislikedGenreWeights[gid]) || 0) + 0.45);
  });
  removeRecommendedCard(card);
  await persistIgnoredMovie(movie, dislikedGenreWeights, "Je l'enlève des recos");
}

function challengeRecommendationJobs(challenge, options = {}) {
  if (!challenge || (challenge.completed && !options.includeCompleted)) return [];
  const jobs = [];
  if (challenge.missingMovieIds?.length) {
    jobs.push(Promise.all(challenge.missingMovieIds.slice(0, 14).map(id =>
      getSagaMovieResult(id).catch(() => null)
    )).then(movies => movies.filter(Boolean).map(movie => ({
      movie,
      meta: { challengeId: challenge.id, sourceWeight: 12 }
    }))));
  }
  if (challenge.suggestedMovies?.length) {
    jobs.push(Promise.resolve(challenge.suggestedMovies.map(movie => ({
      movie: challenge.directorId
        ? { ...movie, _directorId: challenge.directorId, _directorName: challenge.directorName }
        : movie,
      meta: { challengeId: challenge.id, sourceWeight: 7.4 }
    }))));
  }
  if (challenge.genreIds?.length) {
    [1, 2].forEach(page => {
      jobs.push(discoverMoviesByGenres(challenge.genreIds, {
        genreOperator: "or",
        "vote_count.gte": "800",
        "vote_average.gte": "6.3",
        sort_by: "vote_count.desc",
        page
      }).then(list => list.map(movie => ({
        movie,
        meta: { challengeId: challenge.id, sourceWeight: 6.8 }
      }))).catch(() => []));
    });
  } else if (challenge.beforeYear) {
    [1, 2].forEach(page => {
      jobs.push(tmdbFetch("/discover/movie", {
        include_adult: "false",
        include_video: "false",
        "primary_release_date.lte": `${challenge.beforeYear - 1}-12-31`,
        "vote_count.gte": "600",
        "vote_average.gte": "6.5",
        sort_by: "vote_count.desc",
        page
      }).then(data => (data.results || []).map(movie => ({
        movie,
        meta: { challengeId: challenge.id, sourceWeight: 6.8 }
      }))).catch(() => []));
    });
  }
  return jobs;
}

async function updateRecommendations() {
  const scroll = document.getElementById("reco-scroll");
  if (!scroll) return;
  const requestId = ++recommendationRequestSeq;
  const userId = currentUser;
  const list = myRanked();

  if (list.length === 0) {
    scroll.innerHTML = `<div style="padding:16px;font-size:12px;color:var(--ink-soft);font-weight:600">Classe des films pour avoir des recommandations</div>`;
    return;
  }

  scroll.innerHTML = `<div style="padding:20px"><span class="loading-spin"></span></div>`;

  try {
    await ensureGenreData();
    if (requestId !== recommendationRequestSeq || userId !== currentUser || !document.body.contains(scroll)) return;
    const freshList = myRanked();
    const genreWeights = computeGenreWeights(freshList);
    const keywordWeights = computeKeywordWeights(freshList);
    const favoriteDirectors = computeFavoriteDirectors(freshList);
    const topKeywords = topWeightedIds(keywordWeights, 6);
    const activeChallenge = activeCinemaChallenge();

    const sources = pickRecommendationSources(freshList, genreWeights);
    const strongGenres = topGenreIds(genreWeights, 4);
    const knownIds = getAllMovieIdsForUser(currentUser);
    const ignoredIds = new Set(recoPrefs.ignoredIds || []);

    const sourceJobs = sources.map(async (source) => {
      try {
        const pages = source.sourceRank <= 3 ? [1, 2] : [1];
        const [recos, similar] = await Promise.all([
          Promise.all(pages.map(page => getRecommendations(source.movie.id, page).catch(() => []))),
          source.sourceRank <= 2 ? Promise.all([1].map(page => getSimilarMovies(source.movie.id, page).catch(() => []))) : Promise.resolve([])
        ]);
        return [
          ...recos.flat().map(movie => ({ movie, meta: { because: source.movie.title, sourceWeight: source.weight } })),
          ...similar.flat().map(movie => ({ movie, meta: { because: source.movie.title, sourceWeight: source.weight * 0.45 } }))
        ];
      } catch (e) {
        return [];
      }
    });
    const discoverJobs = challengeRecommendationJobs(activeChallenge);
    if (strongGenres.length >= 2) {
      [1, 2].forEach(page => {
        discoverJobs.push(discoverMoviesByGenres(strongGenres.slice(0, 2), {
          "vote_count.gte": "160",
          sort_by: "vote_average.desc",
          page
        }).then(list => list.map(movie => ({ movie, meta: { sourceWeight: 2.4 } }))).catch(() => []));
      });
      [1, 2, 3].forEach(page => {
        discoverJobs.push(discoverMoviesByGenres(strongGenres.slice(0, 3), {
          genreOperator: "or",
          "vote_count.gte": "240",
          sort_by: "vote_average.desc",
          page
        }).then(list => list.map(movie => ({ movie, meta: { sourceWeight: 1.1 } }))).catch(() => []));
      });
    }
    if (strongGenres.length >= 1) {
      [1, 2, 3].forEach(page => {
        discoverJobs.push(discoverMoviesByGenres([strongGenres[0]], {
          "vote_count.gte": "220",
          sort_by: "vote_average.desc",
          page
        }).then(list => list.map(movie => ({ movie, meta: { sourceWeight: 1.4 } }))).catch(() => []));
      });
    }
    favoriteDirectors.forEach(director => {
      discoverJobs.push(tmdbFetch("/discover/movie", {
        include_adult: "false",
        include_video: "false",
        with_crew: String(director.id),
        sort_by: "vote_average.desc",
        "vote_count.gte": "50",
        page: 1
      }).then(d => (d.results || []).map(movie => ({
        movie,
        meta: { because: director.name, sourceWeight: 6.2 }
      }))).catch(() => []));
    });
    if (topKeywords.length >= 2) {
      discoverJobs.push(tmdbFetch("/discover/movie", {
        include_adult: "false",
        include_video: "false",
        with_keywords: topKeywords.slice(0, 4).join("|"),
        sort_by: "vote_average.desc",
        "vote_count.gte": "120",
        page: 1
      }).then(d => (d.results || []).map(movie => ({
        movie,
        meta: { sourceWeight: 3.6 }
      }))).catch(() => []));
    }

    const results = await Promise.all([...sourceJobs, ...discoverJobs]);
    if (requestId !== recommendationRequestSeq || userId !== currentUser || !document.body.contains(scroll)) return;

    const merged = new Map();
    results.flat().forEach(({ movie, meta }) => {
      const challengeMatch = !!activeChallenge && (meta.challengeId === activeChallenge.id || challengeMatchesMovie(movie, activeChallenge));
      if (shouldKeepRecommendationCandidate(movie, knownIds, ignoredIds, genreWeights, meta.sourceWeight || 0, challengeMatch)) {
        mergeRecommendationCandidate(merged, movie, challengeMatch ? { ...meta, challengeId: activeChallenge.id } : meta);
      }
    });

    const { boost: crossBoostMap, reason: crossReasonMap } = computeCrossProfileSignals(currentUser);
    const candidates = [...merged.values()].map(m => {
      const cb = crossBoostMap.get(Number(m.id)) || 0;
      const cr = crossReasonMap.get(Number(m.id));
      const challengeMatch = !!activeChallenge && challengeMatchesMovie(m, activeChallenge);
      return {
        ...m,
        ...(cb ? { _crossBoost: cb, _crossReason: cr?.text } : {}),
        ...(challengeMatch ? { _challengeBoost: 28, _challengeName: activeChallenge.name } : {})
      };
    });
    let scored = sortRecommendationCandidates(candidates, genreWeights, recoPrefs, 8);
    if (scored.length < 6) {
      const softPrefs = normalizeRecoPrefs({
        ignoredIds: recoPrefs.ignoredIds,
        dislikedGenreWeights: {},
        updatedAt: recoPrefs.updatedAt
      });
      const relaxed = sortRecommendationCandidates(candidates, genreWeights, softPrefs, 0);
      const existing = new Set(scored.map(m => m.id));
      scored = [...scored, ...relaxed.filter(m => !existing.has(m.id))];
    }
    if (scored.length < 6) {
      const fallback = candidates
        .filter(m => (m.genre_ids || []).some(gid => genreWeights[gid] > 0))
        .sort((a,b) => ((b.vote_average || 0) * Math.log10((b.vote_count || 0) + 10)) - ((a.vote_average || 0) * Math.log10((a.vote_count || 0) + 10)));
      const existing = new Set(scored.map(m => m.id));
      scored = [...scored, ...fallback.filter(m => !existing.has(m.id))];
    }
    const final = scored.slice(0, 10);

    if (!final.length) {
      renderNoRecommendationsMessage(scroll);
      return;
    }

    scroll.innerHTML = final.map(m => {
      const poster = m.poster_path ? TMDB_IMG + m.poster_path : "";
      const title = escapeHtml(m.title);
      const year = m.release_date ? escapeHtml(m.release_date.slice(0,4)) : "?";
      const rating = m.vote_average ? Number(m.vote_average).toFixed(1) : "—";
      return `
      <div class="reco-item" data-id="${escapeAttr(m.id)}">
        <button class="reco-dismiss-btn" data-movie='${escapeAttr(JSON.stringify(simplifyMovie(m)))}' type="button" aria-label="Pas envie">${tabIconHtml("x")}</button>
        ${poster ? `<img src="${poster}" alt="${escapeAttr(m.title)}">` : `<div style="aspect-ratio:2/3;background:#eee"></div>`}
        <div class="reco-item-body">
          <div class="reco-item-title">${title}</div>
          <div class="reco-item-meta">${year} · ⭐${rating}</div>
          <div class="reco-item-reason">${escapeHtml(recommendationReason(m))}</div>
          <button class="reco-add-btn" data-movie='${escapeAttr(JSON.stringify(simplifyMovie(m)))}'>Choisir</button>
        </div>
      </div>`;
    }).join("");

    scroll.querySelectorAll(".reco-add-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        openMovieActionSheet(JSON.parse(btn.dataset.movie), "recommendation");
      });
    });
    scroll.querySelectorAll(".reco-dismiss-btn").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        ignoreRecommendedMovie(JSON.parse(btn.dataset.movie), btn.closest(".reco-item"));
      });
    });
  } catch (e) {
    if (requestId !== recommendationRequestSeq || userId !== currentUser || !document.body.contains(scroll)) return;
    scroll.innerHTML = `<div style="padding:16px;font-size:12px;color:var(--ink-soft);font-weight:600">Erreur de chargement</div>`;
  }
}

function renderRecentFeed() {
  const el = document.getElementById("recent-list");
  if (!el) return;

  const entries = [];
  Object.entries(allWatched).forEach(([userId, list]) => {
    const profile = PROFILES.find(p => p.id === userId);
    if (!profile) return;
    list.forEach(m => {
      const rating = Number.isFinite(Number(m.rating)) ? `${Number(m.rating)}/10` : "vu";
      entries.push({
        movie: m,
        userId,
        profile,
        label: rating,
        addedAt: m.watchedAt || m.addedAt || 0
      });
    });
  });
  Object.entries(allRankings).forEach(([userId, list]) => {
    const profile = PROFILES.find(p => p.id === userId);
    if (!profile) return;
    list.forEach((m, i) => {
      entries.push({ movie: m, userId, profile, label: `#${i + 1}`, addedAt: m.addedAt || 0 });
    });
  });

  const byMovie = {};
  entries.forEach(e => {
    if (!byMovie[e.movie.id]) byMovie[e.movie.id] = { movie: e.movie, raters: [], latestAddedAt: 0 };
    const existing = byMovie[e.movie.id].raters.find(r => r.profile.id === e.profile.id && r.label === e.label);
    if (!existing) byMovie[e.movie.id].raters.push({ profile: e.profile, label: e.label });
    byMovie[e.movie.id].latestAddedAt = Math.max(byMovie[e.movie.id].latestAddedAt, e.addedAt);
  });

  const grouped = Object.values(byMovie).sort((a,b) => b.latestAddedAt - a.latestAddedAt).slice(0, 20);

  if (!grouped.length) {
    el.innerHTML = `<div class="empty-state" style="margin:0">Personne n'a encore vu ou classé de film</div>`;
    return;
  }

  el.innerHTML = grouped.map(g => {
    const poster = g.movie.poster_path ? TMDB_IMG + g.movie.poster_path : "";
    return `
    <div class="recent-row" data-movie='${escapeAttr(JSON.stringify(simplifyMovie(g.movie)))}'>
      ${poster ? `<img class="recent-poster" src="${poster}" alt="${escapeAttr(g.movie.title)}">` : `<div class="recent-poster" style="background:#E8E4F5"></div>`}
      <div class="recent-info">
        <div class="recent-title">${escapeHtml(g.movie.title)}</div>
        <div class="recent-raters">
          ${g.raters.map(r => `
            <span class="rater-chip" style="--pc:${escapeAttr(r.profile.color)}">
              <span class="rater-initial">${escapeHtml(r.profile.initial)}</span>
              ${escapeHtml(r.label)}
            </span>
          `).join("")}
        </div>
      </div>
    </div>`;
  }).join("");

  el.querySelectorAll(".recent-row").forEach(row => {
    row.addEventListener("click", () => {
      openMovieActionSheet(JSON.parse(row.dataset.movie), "recent");
    });
  });
}

document.addEventListener("DOMContentLoaded", () => {
  applyPlatformMode();
  setupPwaInstallMetadata();
  setupForegroundPushListener();
  renderInstallSheetContent();

  const scrollLockObserver = new MutationObserver(scheduleScrollLockUpdate);
  scrollLockObserver.observe(document.body, {
    childList: true,
    subtree: true,
    attributes: true,
    attributeFilter: ["class", "style"]
  });
  window.addEventListener("resize", scheduleScrollLockUpdate);
  window.addEventListener("orientationchange", scheduleScrollLockUpdate);
  document.addEventListener("touchmove", (e) => {
    if (!document.body.classList.contains("no-page-scroll")) return;
    if (touchDragState || canTouchScrollInside(e.target)) return;
    e.preventDefault();
  }, { passive: false });

  setupPlatformOverlayHistory();
  renderPage();

  setTimeout(() => {
    if (!profilesSynced || (currentUser && !rankingsSynced)) {
      profilesSynced = true;
      rankingsSynced = true;
      renderPage();
    }
  }, 3500);

  document.getElementById("recommend-overlay").addEventListener("click", (e) => {
    if (e.target.id === "recommend-overlay") closeRecommendSheet();
  });
  document.getElementById("movie-action-overlay").addEventListener("click", (e) => {
    if (e.target.id === "movie-action-overlay") closeMovieActionSheet();
  });
  document.getElementById("install-overlay").addEventListener("click", (e) => {
    if (e.target.id === "install-overlay") closeInstallSheet();
  });
  document.getElementById("btn-close-install").addEventListener("click", closeInstallSheet);
  document.getElementById("settings-overlay").addEventListener("click", (e) => {
    if (e.target.id === "settings-overlay") closeSettingsSheet();
  });
  document.getElementById("btn-close-settings").addEventListener("click", closeSettingsSheet);
  document.getElementById("cinema-challenges-overlay").addEventListener("click", (e) => {
    if (e.target.id === "cinema-challenges-overlay") closeChallengesSheet();
  });
  document.getElementById("btn-close-challenges").addEventListener("click", closeChallengesSheet);
  document.getElementById("badge-movies-overlay").addEventListener("click", (e) => {
    if (e.target.id === "badge-movies-overlay") closeBadgeMoviesSheet();
  });
  document.getElementById("btn-close-badge-movies").addEventListener("click", closeBadgeMoviesSheet);
  document.getElementById("badge-unlock-overlay").addEventListener("click", (e) => {
    if (e.target.id === "badge-unlock-overlay") closeBadgeUnlockSheet();
  });
  document.getElementById("btn-close-badge-unlock").addEventListener("click", closeBadgeUnlockSheet);
  document.getElementById("btn-view-unlocked-badge").addEventListener("click", viewUnlockedBadge);
  document.getElementById("confirm-overlay").addEventListener("click", (e) => {
    if (e.target.id === "confirm-overlay") closeConfirmSheet();
  });
  document.getElementById("btn-cancel-confirm").addEventListener("click", closeConfirmSheet);
  document.getElementById("btn-confirm-action").addEventListener("click", runConfirmedAction);
  document.getElementById("rating-overlay").addEventListener("click", (e) => {
    if (e.target.id === "rating-overlay") closeRatingSheet();
  });
  document.getElementById("btn-cancel-rating").addEventListener("click", closeRatingSheet);
  document.getElementById("tonight-pick-overlay").addEventListener("click", (e) => {
    if (e.target.id === "tonight-pick-overlay") closeTonightPickSheet();
  });
  const btnTonightPickWatch = document.getElementById("btn-tonight-pick-watch");
  btnTonightPickWatch.insertAdjacentHTML("afterbegin", surfaceIconHtml("clapperboard", "tonight-pick-btn-icon"));
  btnTonightPickWatch.addEventListener("click", () => {
    const movie = tonightPickMovie;
    if (!movie) return;
    closeTonightPickSheet();
    openRatingSheet(movie, "watchlist");
  });
  const btnTonightPickReroll = document.getElementById("btn-tonight-pick-reroll");
  btnTonightPickReroll.insertAdjacentHTML("afterbegin", surfaceIconHtml("refresh", "tonight-pick-btn-icon"));
  btnTonightPickReroll.addEventListener("click", rerollTonightPick);
  document.querySelectorAll(".context-handle").forEach(handle => {
    handle.addEventListener("click", () => closeOverlayElement(handle.closest(".context-overlay")));
  });
  document.addEventListener("keydown", (event) => {
    if (event.key !== "Escape") return;
    const openOverlays = [...document.querySelectorAll(".context-overlay.show")];
    const topOverlay = openOverlays[openOverlays.length - 1];
    if (topOverlay) closeOverlayElement(topOverlay);
  });
  listenProfiles((list, metadata) => {
    PROFILES = list;
    const serverConfirmed = !metadata.fromCache && !metadata.failed;
    if (serverConfirmed) profilesServerConfirmed = true;
    const currentProfileExists = !currentUser || list.some(p => p.id === currentUser);
    const canRenderProfiles = list.length > 0 || serverConfirmed || metadata.failed;

    // On ne considère pas un snapshot vide depuis le cache comme une vérité :
    // au démarrage, il peut arriver avant la synchro serveur et ne doit pas
    // effacer la session locale ni afficher l'écran "aucun profil".
    if (!canRenderProfiles || (currentUser && !currentProfileExists && !serverConfirmed && !onboardingNewUser)) {
      renderBootLoading();
      return;
    }

    profilesSynced = true;
    if (currentUser && serverConfirmed && !list.some(p => p.id === currentUser)) {
      ensureProfileInCloud(currentUser);
    }
    if (!onboardingNewUser && serverConfirmed) normalizeActiveUsers();
    if (currentUser && !viewingUser) viewingUser = currentUser;
    renderPagePreservingScroll();
  });
  listenProfileIndex(list => {
    PROFILE_INDEX = list;
    if (currentUser && !profileById(currentUser)) ensureProfileInCloud(currentUser);
    if (profilesSynced && rankingsSynced && currentUser && !onboardingNewUser) renderPagePreservingScroll();
  });
  listenAllRankings(data => {
    allRankings = data;
    const firstSync = !rankingsSynced;
    rankingsSynced = true;
    if (firstSync || !profilesSynced || onboardingNewUser) {
      renderPage();
      return;
    }
    if (currentUser && (activeTab === "top" || activeTab === "friends")) renderRanked();
    if (currentUser && activeTab === "search" && recentExpanded) renderRecentFeed();
  });
  listenAllWatched(data => {
    allWatched = data;
    if (profilesSynced && rankingsSynced && currentUser && activeTab === "watched") renderWatchedList();
    if (profilesSynced && rankingsSynced && currentUser && activeTab === "search" && recentExpanded) renderRecentFeed();
    if (profilesSynced && rankingsSynced && currentUser && activeTab === "badges") refreshBadgesTabIfActive();
  });
  listenAllWatchlist(data => {
    allWatchlist = data;
    if (profilesSynced && rankingsSynced && currentUser && activeTab === "watchlist") renderWatchlist();
  });
  listenIncomingRecos(data => {
    incomingRecos = data;
    if (profilesSynced && rankingsSynced && currentUser && !onboardingNewUser) renderPagePreservingScroll();
  });
});
</script>

<style>

  --card: #FFFFFF;
  --ink: #2D2A3D;

  --ink-faint: #C7C2DD;

  --shadow-d: rgba(180,170,220,0.35);
  --shadow-l: rgba(255,255,255,0.9);

  --pink: #FF9EB5;   --pink-deep: #7a1f3a;
  --mint: #A8E6CF;   --mint-deep: #1f5a3a;
  --sky: #A8D8FF;    --sky-deep: #1f3a5a;
  --gold: #FFD9A0;   --gold-deep: #7a5a1f;

}

body.no-page-scroll {
  overflow: hidden;

}

}

}

  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 40px 24px;
}
.profile-logo-img {

.profile-name { font-weight: 700; font-size: 13px; }

.profile-cards { flex-wrap: wrap; justify-content: center; }
.profile-card-add { border: 2px dashed var(--ink-faint); box-shadow: none; background: transparent; }
.profile-add-icon { background: var(--bg); color: var(--ink-soft); box-shadow: inset 3px 3px 6px var(--shadow-d), inset -3px -3px 6px var(--shadow-l); font-size: 26px; }

.btn-secondary {
  width: 100%; background: transparent; color: var(--ink-soft); border: none;
  padding: 12px; font-weight: 700; font-size: 14px; cursor: pointer;
  font-family: 'Plus Jakarta Sans', sans-serif;
}

/* ═══════════════ ONBOARDING ═══════════════ */
.onboard-screen { width: 100%; max-width: 540px; min-height: 100vh; margin: 0 auto; padding: 60px 24px 24px; }
.onboard-screen .profile-logo-img { display: block; margin: 0 auto 20px; }
.onboard-step { font-size: 11px; font-weight: 700; color: var(--lav-deep); letter-spacing: 1.5px; margin-bottom: 8px; }
.onboard-title { font-weight: 800; font-size: 26px; margin-bottom: 10px; }
.onboard-text { font-size: 14px; color: var(--ink-soft); font-weight: 500; line-height: 1.6; }
.onboard-text strong { color: var(--ink); }
.gate-screen {
  width: 100%; max-width: 540px; min-height: 100vh; margin: 0 auto; padding: 58px 24px calc(env(safe-area-inset-bottom, 24px) + 24px);

}
.gate-screen .profile-logo-img { display: block; margin: 0 auto 22px; }
.gate-steps {

}
.gate-step {

.gate-step span {

/* ═══════════════ AVATAR HELPERS ═══════════════ */
.avatar-poster { border-radius: 50%; object-fit: cover; display: inline-block; vertical-align: middle; }
.avatar-initial-sm {
  border-radius: 50%; color: white; font-weight: 800; font-size: 10px;
  display: inline-flex; align-items: center; justify-content: center; vertical-align: middle;
}

/* ═══════════════ NOTIFICATION BANNER ═══════════════ */
.reco-banner-zone { padding: 14px 20px 0; display: flex; flex-direction: column; gap: 10px; }
.reco-inbox-heading {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 0 2px 2px;
}
.reco-inbox-heading div { min-width: 0; }
.reco-inbox-heading strong { display: block; font-size: 13px; font-weight: 800; }
.reco-inbox-heading span { display: block; margin-top: 2px; color: var(--ink-soft); font-size: 9.5px; font-weight: 700; }
.reco-inbox-heading button {
  flex: 0 0 auto; border: none; background: transparent; color: var(--lav-deep); padding: 6px 0 2px;
  font: 800 10.5px 'Plus Jakarta Sans', sans-serif;
}
.reco-banner {
  background: linear-gradient(120deg, var(--gold), var(--pink));
  border-radius: 18px; padding: 12px 14px; display: flex; align-items: center; gap: 12px;
  box-shadow: 5px 5px 14px var(--shadow-d), -5px -5px 14px var(--shadow-l);
