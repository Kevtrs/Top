<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Le Top - Confirmation v9</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #ebe7f3; color: #302b40; font-family: 'Plus Jakarta Sans', sans-serif; }
    .phone { width: 393px; height: 852px; border: 9px solid #272331; border-radius: 48px; overflow: hidden; position: relative; background: #f6f4fc; box-shadow: 14px 22px 48px rgba(52,42,73,.22); }
    .island { position: absolute; z-index: 9; left: 50%; top: 11px; width: 112px; height: 29px; transform: translateX(-50%); border-radius: 20px; background: #272331; }
    .screen { height: 100%; padding: 56px 20px; filter: brightness(.76); opacity: .72; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 23px; font-weight: 800; }
    .brand img { width: 43px; height: 43px; border-radius: 13px; }
    .title { margin-top: 34px; font-size: 28px; font-weight: 800; }
    .row { margin-top: 14px; padding: 17px; border-radius: 17px; background: white; box-shadow: 5px 6px 15px #ddd7e8; }
    .row strong { display: block; font-size: 14px; }
    .row small { color: #948ba7; font-size: 10px; }
    .sheet { position: absolute; z-index: 10; left: 0; right: 0; bottom: 0; padding: 10px 22px 40px; border-radius: 28px 28px 0 0; background: rgba(255,255,255,.97); text-align: center; box-shadow: 0 -16px 40px rgba(45,38,61,.2); }
    .handle { width: 38px; height: 4px; margin: 0 auto 18px; border-radius: 5px; background: #c7bfd8; }
    .icon { width: 60px; height: 60px; margin: 0 auto 14px; border-radius: 19px; display: grid; place-items: center; color: #d64668; background: #ffe8ee; box-shadow: inset 3px 3px 8px #e7d5df, inset -3px -3px 8px white; }
    .icon svg { width: 28px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    h1 { margin: 0; font-size: 22px; }
    p { margin: 9px auto 22px; color: #9188a4; font-size: 12px; font-weight: 600; line-height: 1.55; }
    .actions { display: grid; grid-template-columns: 1fr 1.25fr; gap: 9px; }
    button { min-height: 50px; border: 0; border-radius: 15px; font: 800 13px 'Plus Jakarta Sans', sans-serif; }
    .cancel { color: #8b829e; background: transparent; }
    .delete { color: white; background: #d64668; }
  </style>
</head>
<body>
  <main class="phone">
    <div class="island"></div>
    <div class="screen">
      <div class="brand"><img src="../letop-icon-192.png" alt="">Le Top</div>
      <div class="title">Réglages</div>
      <div class="row"><strong>Vider mon Top</strong><small>Garde ton compte et tes films vus</small></div>
      <div class="row"><strong>Supprimer mon compte</strong><small>Supprime le profil et ses données</small></div>
    </div>
    <section class="sheet">
      <div class="handle"></div>
      <div class="icon"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5M14 11v5"/></svg></div>
      <h1>Supprimer Kevin ?</h1>
      <p>Son Top, ses films vus, sa liste À voir et ses recommandations seront supprimés définitivement.</p>
      <div class="actions"><button class="cancel">Annuler</button><button class="delete">Supprimer</button></div>
    </section>
  </main>
</body>
</html>
