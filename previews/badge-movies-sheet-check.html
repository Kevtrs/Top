<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>Badge films check</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#F6F4FC;color:#2D2A3D;font-family:Arial,sans-serif}.back{padding:26px 20px;color:#9A93B8}.overlay{position:fixed;inset:0;background:rgba(37,32,51,.24);display:flex;align-items:flex-end}.sheet{width:100%;max-height:88vh;overflow:auto;padding:10px 14px 28px;border-radius:24px 24px 0 0;background:rgba(255,255,255,.96)}.handle{width:44px;height:5px;margin:0 auto 13px;border-radius:99px;background:#C9C2DD}.head{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;align-items:center;padding:4px 4px 12px}.art{width:76px;height:76px;position:relative;overflow:hidden;background-image:linear-gradient(155deg,rgba(30,25,48,.05),rgba(30,25,48,.7)),url('https://image.tmdb.org/t/p/w500/oiwc338EoBgS4sEI2ixAny4KQKg.jpg');background-size:cover;background-position:center;clip-path:polygon(16% 5%,84% 5%,98% 24%,91% 79%,50% 98%,9% 79%,2% 24%)}.art i{position:absolute;right:7px;bottom:7px;width:28px;height:28px;display:grid;place-items:center;border:1px solid white;border-radius:50%;color:white;background:rgba(48,40,73,.82);font-style:normal}.copy span{color:#8E6BD6;font-size:9px;font-weight:800}.copy strong{display:block;margin-top:3px;font-size:17px}.copy p{margin:3px 0;color:#9A93B8;font-size:10.5px}.progress{height:5px;margin-top:7px;border-radius:99px;background:#EEEAF7;overflow:hidden}.progress i{display:block;width:67%;height:100%;background:linear-gradient(90deg,#AD91E8,#EF9EBD)}.objective{grid-column:1/-1;border:0;border-radius:12px;min-height:42px;background:#F4F0FB;color:#7155A8;font-weight:800}.title{padding:8px 4px 10px;font-size:13px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{border:0;padding:0 0 8px;overflow:hidden;border-radius:13px;background:#fff;text-align:left;color:#2D2A3D;box-shadow:3px 3px 8px #DED9EB}.poster{position:relative;display:block}.poster img{width:100%;aspect-ratio:2/3;display:block;object-fit:cover}.state{position:absolute;left:6px;right:6px;bottom:6px;padding:5px;border-radius:8px;background:rgba(45,42,61,.84);color:#fff;font-size:8px;font-weight:800;text-align:center}.state.top{background:rgba(133,95,201,.92)}.state.seen{background:rgba(47,145,126,.92)}.state.watch{background:rgba(75,130,189,.92)}.card strong{display:-webkit-box;min-height:29px;margin:7px 7px 0;overflow:hidden;font-size:10.5px;line-height:1.3;-webkit-line-clamp:2;-webkit-box-orient:vertical}.card small{display:block;margin:3px 7px 0;color:#9A93B8;font-size:8.5px}.close{width:100%;margin-top:14px;border:0;border-radius:14px;padding:13px;background:#F4F0FB;color:#7155A8;font-weight:800}
</style>
</head>
<body><div class="back">Le Top · Collection de badges</div><div class="overlay"><section class="sheet"><div class="handle"></div><header class="head"><div class="art"><i>○</i></div><div class="copy"><span>2 / 3</span><strong>L'Anneau unique</strong><p>Traverse la Terre du Milieu jusqu'au Mordor.</p><div class="progress"><i></i></div></div><button class="objective">Choisir comme objectif</button></header><div class="title">Films associés</div><div class="grid">
<button class="card"><span class="poster"><img src="https://image.tmdb.org/t/p/w342/5OPg6M0yHr21Ovs1fni2H1xpKuF.jpg"><i class="state top">Top #8</i></span><strong>La Communauté de l'anneau</strong><small>2001</small></button>
<button class="card"><span class="poster"><img src="https://image.tmdb.org/t/p/w342/qVHBqQYLDRs7ESjP9q6o9iPHLWj.jpg"><i class="state seen">Vu · 8/10</i></span><strong>Les Deux Tours</strong><small>2002</small></button>
<button class="card"><span class="poster"><img src="https://image.tmdb.org/t/p/w342/ypUCFOvOf07bcHy81jng9LyMUfi.jpg"><i class="state">À découvrir</i></span><strong>Le Retour du roi</strong><small>2003</small></button>
</div><button class="close">Fermer</button></section></div></body>
</html>
