<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tab bar v9</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f6f4fc;font-family:Arial,sans-serif}.wrap{position:fixed;left:0;right:0;bottom:0;padding:0 12px 8px}.bar{margin:auto;width:min(620px,100%);height:78px;display:flex;align-items:stretch;padding:7px 5px 11px;border-radius:25px 25px 34px 34px;background:rgba(255,255,255,.96);box-shadow:8px 8px 22px #ded9eb}.item{all:unset;flex:.78 1 0;min-width:0;height:56px;display:flex;align-items:center;justify-content:center;gap:0;color:#bcc2c9;position:relative;border-radius:16px}.item:before{content:"";position:absolute;left:50%;top:8px;width:38px;height:38px;border-radius:14px;background:#fdecef;opacity:0;transform:translateX(-50%) scale(.7)}.item.active{flex-grow:1.72;gap:3px;color:#805fc6}.item.active:before{width:calc(100% - 8px);max-width:112px;opacity:1;transform:translateX(-50%)}.icon{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;position:relative;z-index:1}.icon svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.text{position:relative;z-index:1;display:none;min-width:0;width:auto;padding-right:5px;font-size:10.5px;font-weight:800;white-space:nowrap}.text.active{display:block}.item:after{content:"";position:absolute;left:50%;bottom:0;width:18px;height:3px;border-radius:9px;background:currentColor;transform:translateX(-50%) scaleX(0)}.item.active:after{transform:translateX(-50%) scaleX(1)}
</style></head><body><nav class="wrap"><div class="bar"><button class="item active"><span class="icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></span><strong class="text active">Recherche</strong></button><button class="item"><span class="icon">♛</span></button><button class="item"><span class="icon">▣</span></button><button class="item"><span class="icon">♧</span></button><button class="item"><span class="icon">◉</span></button><button class="item"><span class="icon">♙</span></button></div></nav></body></html>
